<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>MaintenanceFlow PRO | Live Maintenance Ops</title>
  
  <!-- Google Fonts: Syne (headings) + Inter (numbers) + DM Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0ede8;
      --surface: #faf9f7;
      --surface-2: #f4f1ec;
      --border: #e2ddd6;
      --text: #1a1714;
      --text-muted: #8a8279;
      --accent: #d4500a;
      --accent-light: #f5e6dc;
      --green: #1e6845;
      --green-light: #d6ede3;
      --amber: #b45309;
      --amber-light: #fef3c7;
      --red: #dc2626;
      --red-light: #fee2e2;
      --blue: #1e40af;
      --blue-light: #dbeafe;
      --shadow: 0 1px 3px rgba(26,23,20,0.06), 0 4px 16px rgba(26,23,20,0.04);
      --shadow-md: 0 8px 28px rgba(26,23,20,0.12);
      --radius: 20px;
      --radius-sm: 12px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ============================================================
       NUMBERS FONT (Inter) + Right-Aligned Currency
       ============================================================ */
    .stat-value,
    .kpi-value,
    .contract-value,
    .amount,
    .cstat-value,
    .bar-amount,
    .line-item-total,
    .totals-row span:last-child {
      font-family: 'Inter', 'DM Sans', sans-serif;
      font-weight: 600;
      letter-spacing: -0.02em;
      font-feature-settings: "tnum" on;
    }

    td.amount-cell,
    th.amount-cell {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* ============================================================
       SVG ICONS
       ============================================================ */
    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      margin-right: 8px;
      vertical-align: middle;
    }
    .icon svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-filled svg {
      fill: currentColor;
      stroke: none;
    }

    .nav-item .icon { color: rgba(255,255,255,0.7); }
    .nav-item.active .icon { color: white; }
    .nav-item:hover .icon { color: white; }

    .btn-primary .icon,
    .btn-sm-primary .icon { color: white; }
    .btn-secondary .icon { color: var(--text-muted); }

    /* ============================================================
       SIDEBAR LOGO
       ============================================================ */
    .sidebar-logo {
      padding: 28px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .sidebar-logo .logo-icon {
      width: 42px;
      height: 42px;
      background: var(--accent);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sidebar-logo .logo-icon svg {
      width: 24px;
      height: 24px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }
    .sidebar-logo .logo-text h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.2rem;
      color: white;
      line-height: 1.2;
    }
    .sidebar-logo .logo-text h2 span { color: var(--accent); }
    .sidebar-logo .logo-text p {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ============================================================
       RESPONSIVE LAYOUT - Grid Breakpoints
       ============================================================ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .contracts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    .customers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      margin-bottom: 28px;
    }

    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 28px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ============================================================
       EXISTING STYLES
       ============================================================ */
    .login-container { max-width: 420px; margin: 100px auto; background: var(--surface); padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow-md); text-align: center; border: 1px solid var(--border); }
    .login-container h2 { font-family: 'Syne', sans-serif; font-size: 1.8rem; margin-bottom: 10px; }
    .login-container h2 span { color: var(--accent); }
    .login-container p { color: var(--text-muted); margin-bottom: 30px; }
    .login-container input, .login-container select { width: 100%; padding: 12px; margin-bottom: 16px; border: 1.5px solid var(--border); border-radius: 10px; font-family: inherit; background: white; }
    .login-container button { width: 100%; padding: 12px; background: var(--text); color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; margin-bottom: 12px; font-weight: 500; transition: all 0.2s; }
    .login-container button:hover { background: var(--accent); transform: translateY(-1px); }
    .demo-btn { background: var(--accent) !important; }
    .demo-btn:hover { background: #b84308 !important; }
    .error-msg { color: #dc2626; text-align: center; margin-top: 12px; font-size: 14px; }
    .divider { text-align: center; margin: 20px 0; color: var(--text-muted); position: relative; }
    .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 45%; height: 1px; background: var(--border); }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .app-container { display: flex; min-height: 100vh; }
    .sidebar { width: 280px; background: var(--text); color: white; position: fixed; height: 100vh; overflow-y: auto; left: 0; top: 0; z-index: 100; }
    .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 24px; cursor: pointer; color: rgba(255,255,255,0.7); transition: all 0.2s; font-size: 0.9rem; }
    .nav-item:hover { background: rgba(255,255,255,0.1); color: white; }
    .nav-item.active { background: var(--accent); color: white; }
    .nav-item span:last-child { font-size: 0.9rem; }

    .main-content { flex: 1; margin-left: 280px; padding: 24px 32px; }
    
    .header { background: var(--surface); border-radius: var(--radius); padding: 20px 28px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; border: 1px solid var(--border); box-shadow: var(--shadow); flex-wrap: wrap; gap: 16px; }
    .header-brand { display: flex; align-items: center; gap: 16px; }
    .header-icon { width: 48px; height: 48px; background: var(--text); border-radius: 14px; display: flex; align-items: center; justify-content: center; }
    .header-icon svg { width: 26px; height: 26px; stroke: var(--surface); stroke-width: 1.8; fill: none; }
    .header h1 { font-family: 'Syne', sans-serif; font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em; }
    .header h1 span { color: var(--accent); }
    .header p { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
    .header-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .user-info { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    
    .btn-primary { background: var(--text); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 500; cursor: pointer; transition: all 0.2s; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary:hover { background: var(--accent); transform: translateY(-1px); }
    .btn-secondary { background: transparent; border: 1.5px solid var(--border); padding: 10px 20px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; background: white; display: inline-flex; align-items: center; gap: 6px; }
    .btn-secondary:hover { border-color: var(--text-muted); background: var(--surface-2); }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); padding: 8px 16px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 6px; }
    .logout-btn { background: transparent; border: 1.5px solid var(--border); padding: 8px 16px; border-radius: var(--radius-sm); cursor: pointer; }
    .logout-btn:hover { background: var(--surface-2); }
    
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); position: relative; transition: all 0.2s; }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 3px 3px 0 0; }
    .stat-card.total::before { background: var(--text); }
    .stat-card.active::before { background: var(--green); }
    .stat-card.expiring::before { background: var(--amber); }
    .stat-card.expired::before { background: var(--red); }
    .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 600; }
    .stat-value { font-size: 2.2rem; margin-top: 10px; letter-spacing: -0.03em; }
    .stat-sub { font-size: 0.7rem; color: var(--text-muted); margin-top: 5px; }
    
    .alert-banner { background: var(--amber-light); border: 1.5px solid #fcd34d; border-radius: 14px; padding: 14px 20px; display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .alert-text { flex: 1; font-size: 0.85rem; color: var(--amber); font-weight: 500; }
    .alert-action { font-size: 0.78rem; text-decoration: underline; cursor: pointer; white-space: nowrap; color: var(--amber); }
    
    .filters-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 24px; }
    .filter-group { display: flex; flex-direction: column; gap: 5px; flex: 1 1 160px; min-width: 120px; }
    .filter-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); font-weight: 600; }
    .filter-input { padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 0.85rem; font-family: inherit; background: var(--surface); outline: none; width: 100%; }
    .filter-select { padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 0.85rem; font-family: inherit; background: var(--surface); cursor: pointer; width: 100%; }
    
    .contract-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 20px; padding: 20px; transition: all 0.2s; cursor: pointer; }
    .contract-card:hover { box-shadow: var(--shadow-md); border-color: var(--text-muted); }
    .contract-card.expiring { border-color: #fcd34d; background: #fffdf5; }
    .contract-card.expired { border-color: #fca5a5; background: #fff8f8; }
    .contract-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .contract-client { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; }
    .contract-type { font-size: 0.7rem; color: var(--text-muted); margin-top: 3px; }
    .contract-details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .detail-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; }
    .detail-value { font-size: 0.85rem; font-weight: 500; margin-top: 3px; }
    .progress-wrap { margin-bottom: 16px; }
    .progress-header { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 6px; }
    .progress-bar { height: 6px; background: var(--surface-2); border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 10px; }
    .progress-fill.green { background: var(--green); }
    .progress-fill.amber { background: var(--amber); }
    .progress-fill.red { background: var(--red); }
    .contract-footer { display: flex; gap: 8px; padding-top: 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .btn-sm { flex: 1; padding: 8px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: 500; cursor: pointer; text-align: center; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 60px; }
    .btn-sm-primary { background: var(--text); color: white; border: none; }
    .btn-sm-primary:hover { background: var(--accent); }
    .btn-sm-ghost { background: transparent; border: 1.5px solid var(--border); }
    .btn-sm-ghost:hover { border-color: var(--accent); background: var(--surface-2); }
    .btn-sm-warning { background: var(--amber-light); color: var(--amber); border: 1.5px solid #fcd34d; }
    .btn-sm-warning:hover { background: var(--amber); color: white; }
    .btn-sm-danger { background: var(--red); color: white; border: none; padding: 8px 12px; border-radius: 10px; font-size: 0.75rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    
    .badge { display: inline-block; font-size: 0.7rem; font-weight: 500; padding: 4px 12px; border-radius: 100px; }
    .badge-active { background: var(--green-light); color: var(--green); }
    .badge-expiring { background: var(--amber-light); color: var(--amber); }
    .badge-expired { background: var(--red-light); color: var(--red); }
    
    .customer-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 20px; padding: 22px 24px; transition: all 0.2s; }
    .customer-card:hover { box-shadow: var(--shadow-md); border-color: var(--text-muted); }
    .customer-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
    .customer-avatar { width: 48px; height: 48px; background: var(--surface-2); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 800; color: var(--text); border: 1.5px solid var(--border); flex-shrink: 0; }
    .customer-name-section { flex: 1; min-width: 100px; }
    .customer-name { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; }
    .customer-type { font-size: 0.7rem; color: var(--text-muted); margin-top: 3px; }
    .customer-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .info-item .info-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; }
    .info-item .info-value { font-size: 0.85rem; font-weight: 500; margin-top: 3px; word-break: break-word; }
    .customer-stats { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .cstat { flex: 1; background: var(--surface-2); border-radius: 10px; padding: 10px; text-align: center; min-width: 60px; }
    .cstat-value { font-size: 1rem; font-weight: 800; }
    .cstat-label { font-size: 0.6rem; text-transform: uppercase; color: var(--text-muted); margin-top: 3px; }
    .customer-footer { display: flex; gap: 8px; padding-top: 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .card-title { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    
    .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; }
    thead th { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); padding: 10px 8px 12px 8px; border-bottom: 1px solid var(--border); text-align: left; letter-spacing: 0.5px; }
    tbody td { padding: 12px 8px; font-size: 0.85rem; border-bottom: 1px solid var(--surface-2); vertical-align: middle; }
    tbody tr:hover { background: var(--surface-2); }
    
    .priority-dot { display: inline-flex; align-items: center; gap: 6px; }
    .priority-dot::before { content: ''; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .priority-high::before { background: var(--accent); }
    .priority-medium::before { background: var(--amber); }
    .priority-low::before { background: var(--green); }
    
    .dispatch-list { display: flex; flex-direction: column; gap: 12px; }
    .dispatch-card { border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 16px; display: flex; align-items: center; gap: 12px; transition: all 0.2s; flex-wrap: wrap; }
    .dispatch-card:hover { background: var(--surface-2); }
    .dispatch-avatar { width: 44px; height: 44px; background: var(--surface-2); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; color: var(--text); flex-shrink: 0; }
    .dispatch-info { flex: 1; min-width: 80px; }
    .dispatch-name { font-size: 0.9rem; font-weight: 600; }
    .dispatch-role { font-size: 0.7rem; color: var(--text-muted); }
    .dispatch-count { background: var(--accent-light); padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; color: var(--accent); white-space: nowrap; }
    
    .amc-list { display: flex; flex-direction: column; gap: 12px; }
    .amc-item { border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 16px; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; flex-wrap: wrap; gap: 8px; }
    .amc-item:hover { background: var(--surface-2); }
    .amc-client { font-weight: 600; font-size: 0.85rem; }
    .amc-expiry { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
    .amc-visits { font-size: 0.7rem; font-weight: 500; text-align: right; }
    
    .action-btn { border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 18px; text-align: left; background: white; cursor: pointer; transition: all 0.2s; width: 100%; display: flex; flex-direction: column; gap: 4px; }
    .action-btn:hover { border-color: var(--accent); background: var(--surface-2); transform: translateY(-2px); }
    .action-btn-title { font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
    .action-btn-sub { font-size: 0.7rem; color: var(--text-muted); }
    
    .dashboard-banner { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 28px; }
    .kpi-item { border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 20px; text-align: center; }
    .kpi-label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
    .kpi-value { font-size: 1.6rem; font-weight: 800; margin-top: 8px; }
    
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(3px); padding: 16px; }
    .modal-content { background: var(--surface); max-width: 700px; width: 100%; border-radius: var(--radius); padding: 28px; border: 1px solid var(--border); box-shadow: var(--shadow-md); max-height: 90vh; overflow-y: auto; }
    .modal-content h3 { font-family: 'Syne', sans-serif; margin-bottom: 20px; font-size: 1.3rem; display: flex; align-items: center; gap: 10px; }
    .modal-content h4 { font-family: 'Syne', sans-serif; margin: 16px 0 12px 0; font-size: 1rem; }
    .modal-content label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
    .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 12px; margin-bottom: 16px; border: 1.5px solid var(--border); border-radius: 10px; font-family: inherit; background: white; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    
    .empty { text-align: center; padding: 40px; color: var(--text-muted); }
    .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    
    /* ============================================================
       MOBILE MENU BUTTON - UPDATED
       ============================================================ */
    .mobile-menu-btn {
      display: none;
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1001;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.3rem;
      box-shadow: var(--shadow-md);
      min-width: 48px;
      min-height: 48px;
      align-items: center;
      justify-content: center;
    }
    .mobile-menu-btn:active {
      transform: scale(0.92);
    }
    
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 999;
    }
    .sidebar-overlay.open {
      display: block;
    }
    
    .visits-list { display: flex; flex-direction: column; gap: 12px; }
    .visit-item { display: flex; align-items: center; gap: 14px; padding: 12px; border: 1.5px solid var(--border); border-radius: 14px; transition: all 0.2s; flex-wrap: wrap; }

<body>
<div id="app">Loading...</div>

<script>
  // ============================================================
  // PERFORMANCE - Cached API Data
  // ============================================================
  let cachedData = {
    clients: null,
    technicians: null,
    sites: null,
    services: null,
    jobs: null,
    amcs: null,
    invoices: null,
    assets: null,
    quotations: null
  };

  const API = '/api';
  let token = null;
  let user = null;
  let currentPage = 'dashboard';
  let sidebarOpen = false;
  let amcFilterStatus = 'all';
  let amcSearchQuery = '';
  let customerFilterType = 'all';
  let customerSearchQuery = '';

  async function fetchAPI(endpoint, options = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(API + endpoint, { ...options, headers });
    if (res.status === 401) { logout(); throw new Error('Session expired'); }
    if (!res.ok) throw new Error((await res.json()).error || 'Request failed');
    return res.json();
  }

  async function fetchWithCache(endpoint, forceRefresh = false) {
    const cacheKey = endpoint.replace(/^\//, '');
    if (!forceRefresh && cachedData[cacheKey]) {
      return cachedData[cacheKey];
    }
    const data = await fetchAPI(endpoint);
    cachedData[cacheKey] = data;
    return data;
  }

  function clearCache() {
    cachedData = {
      clients: null,
      technicians: null,
      sites: null,
      services: null,
      jobs: null,
      amcs: null,
      invoices: null,
      assets: null,
      quotations: null
    };
  }

  // ============================================================
  // SVG ICON HELPERS
  // ============================================================
  function iconSVG(name, size = 20) {
    const icons = {
      dashboard: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`,
      amc: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`,
      tasks: `<svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
      myTasks: `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
      invoices: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`,
      assets: `<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>`,
      quotations: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`,
      customers: `<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
      sites: `<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
      technicians: `<svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`,
      services: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`,
      plus: `<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
      pdf: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`,
      logo: `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`
    };
    return icons[name] || icons.dashboard;
  }

  function iconHtml(name, className = '') {
    return `<span class="icon ${className}">${iconSVG(name)}</span>`;
  }

  // ============================================================
  // SIDEBAR TOGGLE (UPDATED FOR MOBILE)
  // ============================================================
  function toggleSidebar() {
    sidebarOpen = !sidebarOpen;
    updateSidebar();
  }

  function closeSidebar() {
    sidebarOpen = false;
    updateSidebar();
  }

  function updateSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.querySelector('.sidebar-overlay');
    if (sidebar) sidebar.classList.toggle('open', sidebarOpen);
    if (overlay) overlay.classList.toggle('open', sidebarOpen);
    document.body.style.overflow = sidebarOpen ? 'hidden' : '';
  }

  // Close sidebar on escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && sidebarOpen) {
      closeSidebar();
    }
  });

  // ============================================================
  // AUTH FUNCTIONS
  // ============================================================
  async function login(email, password) {
    try {
      const res = await fetch(API + '/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
      if (!res.ok) throw new Error('Invalid email or password');
      const data = await res.json();
      token = data.token; user = data.user;
      localStorage.setItem('token', token); localStorage.setItem('user', JSON.stringify(user));
      clearCache();
      renderApp();
    } catch (err) { document.getElementById('errorMsg') && (document.getElementById('errorMsg').innerText = err.message); }
  }

  async function signup(email, password, company_name, currency) {
    try {
      const res = await fetch(API + '/auth/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password, company_name, currency }) });
      if (!res.ok) throw new Error((await res.json()).error || 'Signup failed');
      const data = await res.json();
      token = data.token; user = data.user;
      localStorage.setItem('token', token); localStorage.setItem('user', JSON.stringify(user));
      clearCache();
      renderApp();
    } catch (err) { document.getElementById('errorMsg') && (document.getElementById('errorMsg').innerText = err.message); }
  }

  async function demoLogin() {
    try {
      const res = await fetch(API + '/auth/demo', { method: 'POST' });
      const data = await res.json();
      token = data.token; user = data.user;
      localStorage.setItem('token', token); localStorage.setItem('user', JSON.stringify(user));
      clearCache();
      renderApp();
    } catch (err) { showToast('Demo login failed: ' + err.message, 'error'); }
  }

  function logout() { token = null; user = null; localStorage.clear(); clearCache(); renderApp(); }

  let showSignup = false;
  function toggleForm() { showSignup = !showSignup; renderApp(); }

  function showToast(message, type = 'success') {
    const existingToast = document.querySelector('.toast');
    if (existingToast) existingToast.remove();
    
    const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
    const titles = { success: 'Success', error: 'Error', warning: 'Warning', info: 'Information' };
    
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <div class="toast-icon">${icons[type] || '✅'}</div>
      <div class="toast-content">
        <div class="toast-title">${titles[type] || 'Success'}</div>
        <div class="toast-message">${message}</div>
      </div>
      <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
    `;
    
    document.body.appendChild(toast);
    
    setTimeout(() => {
      if (toast && toast.parentElement) {
        toast.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }
    }, 4000);
  }

  function generatePDFInvoice(client, description, amount) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const sym = user?.currency === 'EUR' ? '€' : 'AED';
    doc.setFont("helvetica");
    doc.setFontSize(18); doc.text("MAINTENANCE FLOW PRO - INVOICE", 14, 20);
    doc.setFontSize(10); doc.text(`Date: ${new Date().toLocaleDateString()}`, 14, 30);
    doc.text(`Invoice #: INV-${Date.now()}`, 14, 36);
    doc.autoTable({ startY: 45, head: [["Description", `Amount (${sym})`]], body: [[description, amount]], theme: "striped", styles: { fontSize: 10 } });
    doc.text(`Customer: ${client}`, 14, doc.lastAutoTable.finalY + 10);
    doc.text(`Total Amount: ${sym} ${amount}`, 14, doc.lastAutoTable.finalY + 18);
    doc.text("Thank you for your business - Maintenance Flow", 14, doc.lastAutoTable.finalY + 28);
    doc.save(`Invoice_${client.replace(/\s/g, "_")}.pdf`);
  }

  function getDaysUntilExpiry(expiryDate) {
    if (!expiryDate) return null;
    const today = new Date();
    const expiry = new Date(expiryDate);
    const diffTime = expiry - today;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    return diffDays;
  }

  function getContractStatus(expiryDate, currentStatus) {
    if (currentStatus === 'Expired') return 'expired';
    const daysLeft = getDaysUntilExpiry(expiryDate);
    if (daysLeft === null) return 'active';
    if (daysLeft < 0) return 'expired';
    if (daysLeft <= 30) return 'expiring';
    return 'active';
  }

  function getContractProgress(startDate, expiryDate) {
    if (!startDate || !expiryDate) return 0;
    const start = new Date(startDate);
    const end = new Date(expiryDate);
    const today = new Date();
    if (today < start) return 0;
    if (today > end) return 100;
    const total = end - start;
    const elapsed = today - start;
    return Math.round((elapsed / total) * 100);
  }

  // ============================================================
  // RENDER APP
  // ============================================================
  async function renderApp() {
    const savedToken = localStorage.getItem('token');
    const savedUser = localStorage.getItem('user');
    
    if (savedToken && savedUser && !token) {
      token = savedToken;
      user = JSON.parse(savedUser);
      try { await fetchAPI('/clients'); } catch { logout(); return; }
    }

    if (!token || !user) {
      document.getElementById('app').innerHTML = `
        <div class="login-container">
          <h2>Maintenance<span>Flow</span> PRO</h2>
          <p>HVAC · MEP · Electrical · Plumbing · Civil</p>
          ${!showSignup ? `
            <input type="email" id="loginEmail" placeholder="Email" value="demo@maintain.com">
            <input type="password" id="loginPassword" placeholder="Password" value="demo123">
            <button onclick="login(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)">Sign In</button>
            <div class="divider">or</div>
            <button class="demo-btn" onclick="demoLogin()">🚀 Try Demo</button>
            <p style="text-align: center; margin-top: 20px;">New user? <a href="#" onclick="toggleForm(); return false;">Create account</a></p>
          ` : `
            <input type="text" id="signupCompany" placeholder="Company Name">
            <input type="email" id="signupEmail" placeholder="Email">
            <input type="password" id="signupPassword" placeholder="Password">
            <select id="signupCurrency"><option value="AED">AED (UAE Dirham)</option><option value="EUR">EUR (Euro)</option></select>
            <button onclick="signup(document.getElementById('signupEmail').value, document.getElementById('signupPassword').value, document.getElementById('signupCompany').value, document.getElementById('signupCurrency').value)">Create Account</button>
            <div class="divider">or</div>
            <button class="demo-btn" onclick="demoLogin()">🚀 Try Demo</button>
            <p style="text-align: center; margin-top: 20px;">Already have an account? <a href="#" onclick="toggleForm(); return false;">Sign In</a></p>
          `}
          <div id="errorMsg" class="error-msg"></div>
        </div>
      `;
      return;
    }
    await showDashboard();
  }

            <div class="kpi-item"><div class="kpi-label">Pending Invoices</div><div class="kpi-value">${pendingInvoices}</div></div>
          </div>
        </div>
      `;
    }
    
    // ==================== MY TASKS PAGE ====================
    else if (currentPage === 'myTasks') {
      const currentTechnician = user?.email === 'demo@maintain.com' ? 'Ahmed' : (user?.name || 'Technician');

  window.showAddQuotationModal = async () => {
    const clients = await fetchWithCache('/clients');
    const services = await fetchWithCache('/services');
    
    let lineItems = [{ description: '', quantity: 1, unit_price: 0 }];
    
    function calculateTotals() {
      const subtotal = lineItems.reduce((sum, item) => sum + (item.quantity * item.unit_price), 0);
      const vat = subtotal * 0.05;
      const total = subtotal + vat;
      const subtotalEl = document.getElementById('quoteSubtotal');
      const vatEl = document.getElementById('quoteVat');
      const totalEl = document.getElementById('quoteTotal');
      if (subtotalEl) subtotalEl.innerText = `AED ${subtotal.toFixed(2)}`;
      if (vatEl) vatEl.innerText = `AED ${vat.toFixed(2)}`;
      if (totalEl) totalEl.innerText = `AED ${total.toFixed(2)}`;
      return { subtotal, vat, total };
    }
    
    function renderLineItems() {
      const container = document.getElementById('quoteLineItemsContainer');
      if (!container) return;
      container.innerHTML = lineItems.map((item, idx) => `
        <div class="line-item-row" data-idx="${idx}">
          <input type="text" class="item-desc" value="${item.description.replace(/"/g, '&quot;')}" placeholder="Service/Product" list="serviceList">
          <input type="number" class="item-qty" value="${item.quantity}" step="1" min="1">
          <input type="number" class="item-price" value="${item.unit_price}" step="0.01" min="0">
          <div class="line-item-total">AED ${(item.quantity * item.unit_price).toFixed(2)}</div>
          <button class="btn-remove">✕</button>
        </div>
      `).join('');
      
      const datalist = document.createElement('datalist');
      datalist.id = 'serviceList';
      datalist.innerHTML = services.map(s => `<option value="${s.name}">`).join('');
      container.appendChild(datalist);
      
      document.querySelectorAll('.item-desc, .item-qty, .item-price').forEach(el => {
        el.addEventListener('input', updateTotals);
      });
      document.querySelectorAll('.btn-remove').forEach(btn => {
        btn.addEventListener('click', removeItem);
      });
      calculateTotals();
    }
    
    function removeItem(e) {
      const idx = parseInt(e.target.closest('.line-item-row').dataset.idx);
      lineItems.splice(idx, 1);
      if (lineItems.length === 0) {
        lineItems = [{ description: '', quantity: 1, unit_price: 0 }];
      }
      renderLineItems();
    }
    
    function updateTotals() {
      const rows = document.querySelectorAll('#quoteLineItemsContainer .line-item-row');
      lineItems = [];
      rows.forEach(row => {
        const description = row.querySelector('.item-desc')?.value || '';
        const quantity = parseFloat(row.querySelector('.item-qty')?.value) || 0;
        const unitPrice = parseFloat(row.querySelector('.item-price')?.value) || 0;
        lineItems.push({ description, quantity, unit_price: unitPrice });
        const totalEl = row.querySelector('.line-item-total');
        if (totalEl) totalEl.innerText = `AED ${(quantity * unitPrice).toFixed(2)}`;
      });
      calculateTotals();
    }
    
    const modal = document.createElement('div');
    modal.className = 'modal';
    modal.style.display = 'flex';
    modal.innerHTML = `
      <div class="modal-content" style="max-width: 700px;">
        <h3>${iconHtml('quotations')} Create New Quotation</h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
          <div>
            <label>Client *</label>
            <select id="quoteClientId">
              ${clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
            </select>
          </div>
          <div>
            <label>Date *</label>
            <input type="date" id="quoteDate" value="${new Date().toISOString().slice(0,10)}">
          </div>
          <div>
            <label>Valid Until</label>
            <input type="date" id="quoteValidUntil">
          </div>
          <div>
            <label>Status</label>
            <select id="quoteStatus">
              <option value="Draft">Draft</option>
              <option value="Sent">Sent</option>
              <option value="Approved">Approved</option>
              <option value="Rejected">Rejected</option>
            </select>
          </div>
        </div>
        
        <div style="margin-top: 16px;">
          <div style="font-weight:700; margin-bottom:12px;">Line Items</div>
          <div class="line-items-header">
            <span>Description</span>
            <span>Qty</span>
            <span>Unit Price</span>
            <span>Total</span>
            <span></span>
          </div>
          <div id="quoteLineItemsContainer"></div>
          <button id="addQuoteLineItemBtn" style="width:100%; margin-top:8px; padding:9px; border:1.5px dashed var(--border); border-radius:10px; background:transparent; cursor:pointer;">
            + Add Line Item
          </button>
        </div>
        
        <div class="totals-box">
          <div class="totals-inner">
            <div class="totals-row"><span>Subtotal</span><span id="quoteSubtotal">AED 0.00</span></div>
            <div class="totals-row"><span>VAT (5%)</span><span id="quoteVat">AED 0.00</span></div>
            <div class="totals-row"><span>Total</span><span id="quoteTotal">AED 0.00</span></div>
          </div>
        </div>
        
        <div style="margin-top: 16px;">
          <label>Notes</label>
          <textarea id="quoteNotes" rows="2" placeholder="Additional notes for customer..."></textarea>
        </div>
        
        <div class="modal-actions">
          <button class="btn-secondary" id="cancelQuoteBtn">Cancel</button>
          <button class="btn-primary" id="saveQuoteBtn">Create Quotation</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    
    renderLineItems();
    
    document.getElementById('addQuoteLineItemBtn').onclick = () => {
      lineItems.push({ description: '', quantity: 1, unit_price: 0 });
      renderLineItems();
    };
    
    document.getElementById('cancelQuoteBtn').onclick = () => modal.remove();
    
    document.getElementById('saveQuoteBtn').onclick = async () => {
      const client_id = document.getElementById('quoteClientId').value;
      const client_name = document.getElementById('quoteClientId').options[document.getElementById('quoteClientId').selectedIndex]?.text;
      const date = document.getElementById('quoteDate').value;
      const valid_until = document.getElementById('quoteValidUntil').value || null;
      const status = document.getElementById('quoteStatus').value;
      const notes = document.getElementById('quoteNotes').value || null;
      
      if (!client_id) {
        showToast('Please select a client', 'error');
        return;
      }
      if (!date) {
        showToast('Please select a date', 'error');
        return;
      }
      
      const validItems = lineItems.filter(item => 
        item.description && item.description.trim() !== '' && 
        item.quantity > 0 && 
        item.unit_price > 0
      );
      
      if (validItems.length === 0) {
        showToast('Add at least one valid line item', 'error');
        return;
      }
      
      const { subtotal, vat, total } = calculateTotals();
      
      try {
        await fetchAPI('/quotations', {
          method: 'POST',
          body: JSON.stringify({
            client_id,
            client_name,
            date,
            valid_until,
            status,
            notes,
            line_items: validItems.map(item => ({
              description: item.description,
              quantity: item.quantity,
              unit_price: item.unit_price
            })),
            subtotal,
            vat,
            total
          })
        });
        
        showToast('Quotation created successfully!', 'success');
        clearCache();
        modal.remove();
        renderApp();
      } catch (err) {
        showToast('Error creating quotation: ' + err.message, 'error');
      }
    };
  };

  window.showAddInvoiceModal = async () => {
    const clients = await fetchWithCache('/clients');
    const services = await fetchWithCache('/services');
    let lineItems = [{ description: '', quantity: 1, unit_price: 0 }];
    
    function calculateTotals() {
      const subtotal = lineItems.reduce((sum, item) => sum + (item.quantity * item.unit_price), 0);
      const vat = subtotal * 0.05;
      const total = subtotal + vat;
      const subtotalEl = document.getElementById('subtotalAmount');
      const vatEl = document.getElementById('vatAmount');
      const totalEl = document.getElementById('totalAmount');
      if (subtotalEl) subtotalEl.innerText = `AED ${subtotal.toFixed(2)}`;
      if (vatEl) vatEl.innerText = `AED ${vat.toFixed(2)}`;
      if (totalEl) totalEl.innerText = `AED ${total.toFixed(2)}`;
      return { subtotal, vat, total };
    }
    
    function renderLineItems() {
      const container = document.getElementById('lineItemsContainer');
      if (!container) return;
      container.innerHTML = lineItems.map((item, idx) => `<div class="line-item-row" data-idx="${idx}"><input type="text" class="item-desc" value="${item.description.replace(/"/g, '&quot;')}" placeholder="Service"><input type="number" class="item-qty" value="${item.quantity}" step="1"><input type="number" class="item-price" value="${item.unit_price}" step="0.01"><div class="line-item-total">AED ${(item.quantity * item.unit_price).toFixed(2)}</div><button class="btn-remove">✕</button></div>`).join('');
      document.querySelectorAll('.item-desc, .item-qty, .item-price').forEach(el => el.addEventListener('input', updateTotals));
      document.querySelectorAll('.btn-remove').forEach(btn => btn.addEventListener('click', removeItem));
      calculateTotals();
    }
    
    function removeItem(e) {
      const idx = parseInt(e.target.closest('.line-item-row').dataset.idx);
      lineItems.splice(idx, 1);
      if (lineItems.length === 0) lineItems = [{ description: '', quantity: 1, unit_price: 0 }];
      renderLineItems();
    }
    
    function updateTotals() {
      const rows = document.querySelectorAll('.line-item-row');
      lineItems = [];
      rows.forEach(row => {
        const description = row.querySelector('.item-desc')?.value || '';
        const quantity = parseFloat(row.querySelector('.item-qty')?.value) || 0;
        const unitPrice = parseFloat(row.querySelector('.item-price')?.value) || 0;
        lineItems.push({ description, quantity, unit_price: unitPrice });
        const totalEl = row.querySelector('.line-item-total');
        if (totalEl) totalEl.innerText = `AED ${(quantity * unitPrice).toFixed(2)}`;
      });
      calculateTotals();
    }
    
    const modal = document.createElement('div'); modal.className = 'modal'; modal.style.display = 'flex';
    modal.innerHTML = `<div class="modal-content" style="max-width: 700px;"><h3>${iconHtml('invoices')} Create New Invoice</h3><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;"><div><label>Client *</label><select id="invClientId">${clients.map(c => `<option value="${c.name}">${c.name}</option>`).join('')}</select></div><div><label>Issue Date *</label><input type="date" id="invDate" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Due Date</label><input type="date" id="invDueDate"></div><div><label>Reference</label><input type="text" id="invRef" placeholder="Ticket/AMC #"></div><div><label>Payment Terms</label><select id="invTerms"><option>Due on Receipt</option><option>Net 7 Days</option><option>Net 14 Days</option><option>Net 30 Days</option></select></div><div><label>TRN Number</label><input type="text" id="invTrn" placeholder="Your TRN"></div></div><div style="margin-top: 16px;"><div style="font-weight:700; margin-bottom:12px;">Line Items</div><div class="line-items-header"><span>Description</span><span>Qty</span><span>Unit Price</span><span>Total</span><span></span></div><div id="lineItemsContainer"></div><button id="addLineItemBtn" style="width:100%; margin-top:8px; padding:9px; border:1.5px dashed var(--border); border-radius:10px; background:transparent; cursor:pointer;">+ Add Line Item</button></div><div class="totals-box"><div class="totals-inner"><div class="totals-row"><span>Subtotal</span><span id="subtotalAmount">AED 0.00</span></div><div class="totals-row"><span>VAT (5%)</span><span id="vatAmount">AED 0.00</span></div><div class="totals-row"><span>Total</span><span id="totalAmount">AED 0.00</span></div></div></div><div class="modal-actions" style="margin-top: 20px;"><button class="btn-secondary" id="cancelInvBtn">Cancel</button><button class="btn-primary" id="saveInvBtn">Create Invoice</button></div></div>`;
    document.body.appendChild(modal);
    renderLineItems();
    document.getElementById('addLineItemBtn').onclick = () => { lineItems.push({ description: '', quantity: 1, unit_price: 0 }); renderLineItems(); };
    document.getElementById('cancelInvBtn').onclick = () => modal.remove();
    document.getElementById('saveInvBtn').onclick = async () => {
      const client_name = document.getElementById('invClientId').value;
      const issueDate = document.getElementById('invDate').value;
      const dueDate = document.getElementById('invDueDate').value;
      const reference = document.getElementById('invRef').value;
      const paymentTerms = document.getElementById('invTerms').value;
      const trnNumber = document.getElementById('invTrn').value;
      if (!client_name) { showToast('Please select a client', 'error'); return; }
      if (!issueDate) { showToast('Please select issue date', 'error'); return; }
      const validItems = lineItems.filter(item => item.description && item.quantity > 0 && item.unit_price > 0);
      if (validItems.length === 0) { showToast('Add at least one line item', 'error'); return; }
      const { subtotal, vat, total } = calculateTotals();
      await fetchAPI('/invoices', { method: 'POST', body: JSON.stringify({ client_name, date: issueDate, due_date: dueDate || null, reference: reference || null, payment_terms: paymentTerms, trn_number: trnNumber, line_items: validItems.map(item => ({ description: item.description, quantity: item.quantity, unit_price: item.unit_price })), subtotal, vat_amount: vat, total, status: 'Pending' }) });
      showToast('Invoice created!', 'success');
      clearCache();
      modal.remove(); renderApp();
    };
  };

    ]);
    const modal = document.createElement('div'); modal.className = 'modal';
    modal.innerHTML = `<div class="modal-content"><h3>${iconHtml('amc')} New AMC Contract</h3><label>Client *</label><select id="amcClientId">${clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select><label>Site</label><select id="amcSiteId"><option value="">None</option></select><label>Contract Type</label><select id="amcContractType"><option value="">Select</option><option>HVAC</option><option>MEP</option><option>Electrical</option><option>Plumbing</option><option>Full Facility</option></select><label>Contract Value (AED)</label><input type="number" id="amcValue" step="0.01"><label>Start Date *</label><input type="date" id="amcStart" value="${new Date().toISOString().slice(0,10)}"><label>Expiry Date *</label><input type="date" id="amcExpiry"><label>Visits per Year</label><select id="amcVisits"><option value="4">4</option><option value="6">6</option><option value="12">12</option><option value="24">24</option></select><label>Technician</label><select id="amcTechnician"><option value="">Select</option>${techs.map(t => `<option value="${t.name}">${t.name} — ${t.role || ''}</option>`).join('')}</select><label>Notes</label><textarea id="amcNotes" rows="2"></textarea><div class="modal-actions"><button class="btn-secondary" id="cancelBtn">Cancel</button><button class="btn-primary" id="saveBtn">Create</button></div></div>`;
    document.body.appendChild(modal);
    const clientSelect = document.getElementById('amcClientId');
    const siteSelect = document.getElementById('amcSiteId');
    clientSelect.onchange = () => { const filtered = sites.filter(s => s.customer_id === clientSelect.value); siteSelect.innerHTML = '<option value="">None</option>' + filtered.map(s => `<option value="${s.id}">${s.name}</option>`).join(''); };
    document.getElementById('cancelBtn').onclick = () => modal.remove();
    document.getElementById('saveBtn').onclick = async () => {
      const clientId = clientSelect.value;
      const clientName = clientSelect.options[clientSelect.selectedIndex]?.text;
      const expiry = document.getElementById('amcExpiry').value;
      const startDate = document.getElementById('amcStart').value;
      if (!clientId || !expiry || !startDate) { showToast('Client, Start Date and Expiry required', 'error'); return; }
      await fetchAPI('/amcs', { method: 'POST', body: JSON.stringify({ clientId, clientName, site_id: document.getElementById('amcSiteId').value || null, contract_type: document.getElementById('amcContractType').value, contract_value: parseFloat(document.getElementById('amcValue').value) || null, start_date: startDate, expiry, visits_per_year: parseInt(document.getElementById('amcVisits').value), technician: document.getElementById('amcTechnician').value || null, notes: document.getElementById('amcNotes').value, status: 'Active', visits_done: 0 }) });
      clearCache();
      modal.remove(); renderApp();
    };
  };

  window.deleteAsset = async (id) => {
    if (confirm('Delete this asset?')) {
      await fetchAPI(`/assets/${id}`, { method: 'DELETE' });
      clearCache();
      renderApp();
    }
  };

  window.viewQuotationDetails = async (id) => {
    const quote = await fetchAPI(`/quotations/${id}`);
    const sym = user?.currency === 'EUR' ? '€' : 'AED';
    const modal = document.createElement('div'); modal.className = 'modal'; modal.style.display = 'flex';
    modal.innerHTML = `
      <div class="modal-content" style="max-width: 600px;">
        <h3>${iconHtml('quotations')} Quotation Details</h3>
        <div style="background: var(--surface-2); padding: 16px; border-radius: 12px; margin-bottom: 20px;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div><strong>Quote #:</strong> ${quote.quote_number}</div>
            <div><strong>Client:</strong> ${quote.client_name || '-'}</div>
            <div><strong>Date:</strong> ${quote.date ? new Date(quote.date).toLocaleDateString() : '-'}</div>
            <div><strong>Valid Until:</strong> ${quote.valid_until ? new Date(quote.valid_until).toLocaleDateString() : '-'}</div>
            <div><strong>Status:</strong> ${quote.status || 'Draft'}</div>
            <div><strong>Total:</strong> ${sym} ${(quote.total || 0).toLocaleString()}</div>
          </div>
        </div>
        <h4>${iconHtml('tasks')} Line Items</h4>
        <div style="max-height: 250px;">
          ${quote.line_items && quote.line_items.length > 0 ? `
            <table style="width:100%;">
              <thead><tr><th>Description</th><th>Qty</th><th>Unit Price</th><th class="amount-cell">Total</th></tr></thead>
              <tbody>
                ${quote.line_items.map(item => `
                  <tr>
                    <td>${item.description}</td>
                    <td>${item.quantity}</td>
                    <td>${sym} ${item.unit_price}</td>
                    <td class="amount-cell">${sym} ${item.total}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : '<div class="empty">No line items</div>'}
        </div>
        ${quote.notes ? `<div style="margin-top: 16px;"><strong>Notes:</strong> ${quote.notes}</div>` : ''}
        <div class="modal-actions"><button class="btn-primary" id="closeDetailsBtn">Close</button></div>
      </div>
    `;
    document.body.appendChild(modal);
    document.getElementById('closeDetailsBtn').onclick = () => modal.remove();
  };

  window.convertQuotationToJob = async (id) => {
    if (confirm('Convert this quotation to a job?')) {
      try {
        await fetchAPI(`/quotations/${id}/convert-to-job`, { method: 'POST' });
        showToast('Quotation converted to job!', 'success');
        clearCache();
        renderApp();
      } catch (err) {
        showToast('Error converting: ' + err.message, 'error');
      }
    }
  };

  window.updateJobStatus = async (id) => {
    const newStatus = prompt('Update status (Assigned / In Progress / Completed):', 'In Progress');
    if (newStatus) {
      await fetchAPI(`/jobs/${id}`, { method: 'PUT', body: JSON.stringify({ status: newStatus }) });
      clearCache();
      renderApp();
    }
  };

  window.deleteCustomer = async (id) => {
    if (confirm('Delete this customer?')) {
      await fetchAPI(`/clients/${id}`, { method: 'DELETE' });
      clearCache();
      renderApp();
    }
  };

  window.deleteSite = async (id) => {
    if (confirm('Delete this site?')) {
      await fetchAPI(`/sites/${id}`, { method: 'DELETE' });
      clearCache();
      renderApp();
    }
  };

  window.deleteTechnician = async (id) => {
    if (confirm('Delete this technician?')) {
      await fetchAPI(`/technicians/${id}`, { method: 'DELETE' });
      clearCache();
      renderApp();
    }
  };

  window.deleteService = async (id) => {
    if (confirm('Delete this service?')) {
      await fetchAPI(`/services/${id}`, { method: 'DELETE' });
      clearCache();
      renderApp();
    }
  };

  window.viewCustomerSites = (id) => { renderApp(); };

  window.toggleSidebar = toggleSidebar;
  window.closeSidebar = closeSidebar;
  window.login = login;
  window.signup = signup;
  window.demoLogin = demoLogin;
  window.logout = logout;
  window.toggleForm = toggleForm;
  window.generatePDFInvoice = generatePDFInvoice;

  renderApp();
</script>
</body>
</html>
