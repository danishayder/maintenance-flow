<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>MaintenanceFlow PRO | Full‑Stack Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f0ede8;
      --surface: #faf9f7;
      --surface-2: #f4f1ec;
      --border: #e2ddd6;
      --text: #1a1714;
      --text-muted: #8a8279;
      --accent: #d4500a;
      --green: #1e6845;
      --green-light: #d6ede3;
      --blue-light: #dbeafe;
      --shadow: 0 1px 3px rgba(26,23,20,0.06), 0 4px 16px rgba(26,23,20,0.04);
      --radius: 20px;
      --radius-sm: 12px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; }
    .demo-banner {
      background: linear-gradient(135deg, #fef3c7 0%, #ffe4b5 100%);
      border-left: 6px solid var(--accent);
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: #78350f;
    }
    .btn-primary, .btn-secondary { cursor: pointer; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 500; }
    .btn-primary { background: var(--text); color: white; }
    .btn-primary:hover { background: var(--accent); }
    .btn-secondary { background: transparent; border: 1.5px solid var(--border); }
    .stats-grid, .main-grid, .bottom-grid { display: grid; gap: 20px; margin-bottom: 24px; }
    .stats-grid { grid-template-columns: repeat(4, 1fr); }
    .main-grid { grid-template-columns: 1fr 340px; }
    .bottom-grid { grid-template-columns: 1fr 1fr; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
    .card-header { display: flex; justify-content: space-between; margin-bottom: 18px; align-items: center; }
    .card-title { font-family: 'Syne', sans-serif; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding-bottom: 10px; font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    td { padding: 12px 0; border-bottom: 1px solid var(--surface-2); font-size: 0.85rem; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 40px; font-size: 0.7rem; }
    .badge-progress { background: var(--blue-light); color: var(--blue); }
    .badge-completed { background: var(--green-light); color: var(--green); }
    .dispatch-card, .amc-item { border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(2px); }
    .modal-content { background: var(--surface); max-width: 500px; width: 90%; border-radius: var(--radius); padding: 28px; }
    .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
    .add-service-btn { margin-top: 8px; width: 100%; background: transparent; border: 1px dashed var(--border); padding: 6px; border-radius: 8px; cursor: pointer; font-size: 0.75rem; }
    .add-service-btn:hover { background: var(--surface-2); }
    @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2,1fr); } .main-grid, .bottom-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div id="app"></div>

<script>
  const API_BASE = window.location.origin + '/api';
  let currentUser = { email: 'admin@maintain.com', role: 'admin', name: 'Demo Admin' };
  let authToken = 'demo-token';
  let jobsChart = null;

  async function apiFetch(endpoint, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...options.headers };
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
    const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  function generatePDFInvoice(client, desc, amount) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text('MaintenanceFlow PRO', 14, 20);
    doc.text(`Invoice #: INV-${Date.now()}`, 14, 30);
    doc.text(`Date: ${new Date().toLocaleDateString()}`, 14, 36);
    doc.autoTable({ startY: 45, head: [['Description', 'Amount (AED)']], body: [[desc, amount]], theme: 'striped' });
    doc.text(`Customer: ${client}`, 14, doc.lastAutoTable.finalY + 10);
    doc.text(`Total: AED ${amount}`, 14, doc.lastAutoTable.finalY + 18);
    doc.save(`Invoice_${client.replace(/\s/g, '_')}.pdf`);
  }

  async function exportCSV(jobs, amcs, invoices) {
    let csv = "Jobs\nCustomer,Service,Technician,Priority,Status\n" + jobs.map(j => `${j.customer_name},${j.service},${j.technician},${j.priority},${j.status}`).join("\n");
    csv += "\n\nAMCs\nClient,Visits/Year,Expiry,Status\n" + amcs.map(a => `${a.client_name},${a.visits_per_year},${a.expiry},${a.status}`).join("\n");
    const blob = new Blob([csv], { type: 'text/csv' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'export.csv'; a.click(); URL.revokeObjectURL(blob);
  }

  async function renderDashboard() {
    try {
      const [jobs, amcs, invoices, clients, techs] = await Promise.all([
        apiFetch('/jobs'), apiFetch('/amcs'), apiFetch('/invoices'), apiFetch('/clients'), apiFetch('/technicians')
      ]);
      const openJobs = jobs.filter(j => j.status !== 'Completed').length;
      const totalRevenue = invoices.reduce((s,i) => s + i.amount, 0);
      const activeTechs = techs.filter(t => t.active).length;

      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="container">
          <div class="demo-banner">🔧 <strong>LIVE DEMO</strong> — MaintenanceFlow PRO. Full‑stack CMMS with real database.</div>
          <div class="dashboard-header" style="display:flex; justify-content:space-between; padding:20px; background:var(--surface); border-radius:var(--radius); margin-bottom:20px;">
            <div><h1>Maintenance<span style="color:var(--accent)">Flow</span> PRO</h1><div style="font-size:0.7rem;">CMMS for Property & Facility Teams</div></div>
            <div><span>👤 ${currentUser.name}</span> <button id="refreshBtn" class="btn-secondary">⟳ Refresh</button></div>
          </div>
          <div class="stats-grid" id="statsGrid"></div>
          <div class="main-grid">
            <div class="card"><div class="card-header"><div class="card-title">📋 Service Jobs</div><button id="newJobBtn" class="btn-secondary">+ New Job</button></div><table><thead><tr><th>Customer</th><th>Service</th><th>Technician</th><th>Priority</th><th>Status</th><th>Actions</th></tr></thead><tbody id="jobsBody"></tbody></table></div>
            <div class="card"><div class="card-header"><div class="card-title">👨‍🔧 Technicians</div></div><div id="dispatchList"></div></div>
          </div>
          <div class="bottom-grid">
            <div class="card"><div class="card-header"><div class="card-title">📑 AMC Contracts</div><button id="newAmcBtn" class="btn-secondary">+ Add</button></div><div id="amcList"></div></div>
            <div class="card"><div class="card-header"><div class="card-title">📊 Dashboard</div><button id="exportCsvBtn" class="btn-secondary">Export CSV</button></div><canvas id="revenueChart" height="120"></canvas><div id="kpiMini"></div></div>
          </div>
          <div class="card"><div class="card-header"><div class="card-title">📄 Recent Invoices</div><button id="createInvoiceBtn" class="btn-secondary">+ Invoice</button></div> <table id="invoiceTable"><thead><tr><th>Client</th><th>Description</th><th>Amount</th><th>Date</th><th>PDF</th></tr></thead><tbody id="invoiceBody"></tbody></table></div>
        </div>
      `;

      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><div class="stat-label">Open Jobs</div><div class="stat-value">${openJobs}</div></div>
        <div class="stat-card"><div class="stat-label">AMC Contracts</div><div class="stat-value">${amcs.length}</div></div>
        <div class="stat-card"><div class="stat-label">Active Techs</div><div class="stat-value">${activeTechs}</div></div>
        <div class="stat-card"><div class="stat-label">Revenue (AED)</div><div class="stat-value">${totalRevenue.toLocaleString()}</div></div>
      `;

      const jobsBody = document.getElementById('jobsBody');
      jobsBody.innerHTML = '';
      jobs.forEach(job => {
        const row = jobsBody.insertRow();
        row.insertCell(0).innerHTML = job.customer_name;
        row.insertCell(1).innerHTML = job.service;
        row.insertCell(2).innerHTML = job.technician;
        row.insertCell(3).innerHTML = `<span style="color:${job.priority==='High'?'var(--accent)':'var(--amber)'}">● ${job.priority}</span>`;
        row.insertCell(4).innerHTML = `<span class="badge ${job.status==='Completed'?'badge-completed':'badge-progress'}">${job.status}</span>`;
        const actionCell = row.insertCell(5);
        actionCell.innerHTML = `<select class="status-update" data-id="${job.id}"><option ${job.status==='In Progress'?'selected':''}>In Progress</option><option ${job.status==='Assigned'?'selected':''}>Assigned</option><option ${job.status==='Completed'?'selected':''}>Completed</option></select> <button class="delete-job" data-id="${job.id}">🗑️</button>`;
        actionCell.querySelector('.status-update').onchange = async (e) => { await apiFetch(`/jobs/${job.id}`, { method: 'PUT', body: JSON.stringify({ status: e.target.value }) }); renderDashboard(); };
        actionCell.querySelector('.delete-job').onclick = async () => { await apiFetch(`/jobs/${job.id}`, { method: 'DELETE' }); renderDashboard(); };
      });

      const dispatchDiv = document.getElementById('dispatchList');
      dispatchDiv.innerHTML = '';
      techs.forEach(tech => {
        const assigned = jobs.filter(j => j.technician === tech.name && j.status !== 'Completed').length;
        dispatchDiv.innerHTML += `<div class="dispatch-card"><div><strong>${tech.name}</strong><div style="font-size:0.7rem;">${tech.role}</div></div><div>${assigned} jobs</div></div>`;
      });

      const amcDiv = document.getElementById('amcList');
      amcDiv.innerHTML = amcs.map(a => `<div class="amc-item"><div><strong>${a.client_name}</strong><div style="font-size:0.7rem;">Exp: ${a.expiry}</div></div><div>${a.visits_per_year}/year <span class="badge">${a.status}</span></div></div>`).join('');

      const invBody = document.getElementById('invoiceBody');
      invBody.innerHTML = '';
      invoices.forEach(inv => {
        const row = invBody.insertRow();
        row.insertCell(0).innerHTML = inv.client_name;
        row.insertCell(1).innerHTML = inv.description;
        row.insertCell(2).innerHTML = `AED ${inv.amount}`;
        row.insertCell(3).innerHTML = inv.date;
        row.insertCell(4).innerHTML = `<button class="btn-secondary" data-inv='${JSON.stringify(inv)}'>PDF</button>`;
        row.cells[4].querySelector('button').onclick = () => generatePDFInvoice(inv.client_name, inv.description, inv.amount);
      });

      const ctx = document.getElementById('revenueChart').getContext('2d');
      if (jobsChart) jobsChart.destroy();
      const last6 = invoices.slice(-6);
      jobsChart = new Chart(ctx, { type: 'bar', data: { labels: last6.map(i => i.date), datasets: [{ label: 'Amount (AED)', data: last6.map(i => i.amount), backgroundColor: '#d4500a' }] } });
      document.getElementById('kpiMini').innerHTML = `<div>Total Invoices: ${invoices.length}</div><div>Collected: AED ${totalRevenue.toLocaleString()}</div>`;

      // Load services for dropdown
      const services = await apiFetch('/services');
      
      document.getElementById('newJobBtn').onclick = () => showJobModal(clients, techs, services);
      document.getElementById('newAmcBtn').onclick = () => showAmcModal(clients);
      document.getElementById('createInvoiceBtn').onclick = () => showInvoiceModal(clients);
      document.getElementById('exportCsvBtn').onclick = () => exportCSV(jobs, amcs, invoices);
      document.getElementById('refreshBtn').onclick = () => renderDashboard();
    } catch (err) {
      console.error(err);
      document.getElementById('app').innerHTML = `<div style="color:red; padding:40px; text-align:center;">❌ Backend not reachable. Please ensure the API server is running at ${API_BASE}.</div>`;
    }
  }

  async function showJobModal(clients, techs, services) {
    const modal = document.createElement('div'); modal.className = 'modal'; modal.style.display = 'flex';
    modal.innerHTML = `
      <div class="modal-content">
        <h3>New Job</h3>
        <select id="jobClient" required>
          <option value="">Select Client</option>
          ${clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
        </select>
        <select id="jobService" required>
          <option value="">Select Service</option>
          ${services.map(s => `<option value="${s.name}">${s.name}</option>`).join('')}
        </select>
        <button type="button" id="addServiceBtn" class="add-service-btn">+ Add New Service</button>
        <select id="jobPriority">
          <option>High</option>
          <option>Medium</option>
          <option>Low</option>
        </select>
        <select id="jobTech" required>
          <option value="">Select Tech</option>
          ${techs.map(t => `<option>${t.name}</option>`).join('')}
        </select>
        <div class="modal-actions">
          <button id="cancelBtn" class="btn-secondary">Cancel</button>
          <button id="saveBtn" class="btn-primary">Create</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    
    document.getElementById('cancelBtn').onclick = () => modal.remove();
    document.getElementById('saveBtn').onclick = async () => {
      const clientId = document.getElementById('jobClient').value;
      const client = clients.find(c => c.id === clientId);
      const service = document.getElementById('jobService').value;
      const priority = document.getElementById('jobPriority').value;
      const tech = document.getElementById('jobTech').value;
      if (!clientId || !service || !tech) return alert('Fill all fields');
      await apiFetch('/jobs', { method: 'POST', body: JSON.stringify({ customerId: clientId, customerName: client.name, service, technician: tech, priority, status: 'Assigned' }) });
      modal.remove();
      renderDashboard();
    };
    
    document.getElementById('addServiceBtn').onclick = async () => {
      const newService = prompt('Enter new service name:');
      if (newService && newService.trim()) {
        await apiFetch('/services', { method: 'POST', body: JSON.stringify({ name: newService.trim() }) });
        renderDashboard(); // Refresh to load new service list
        modal.remove();
      }
    };
  }

  async function showAmcModal(clients) {
    const modal = document.createElement('div'); modal.className = 'modal'; modal.style.display = 'flex';
    modal.innerHTML = `<div class="modal-content"><h3>New AMC</h3><select id="amcClient"><option>Select Client</option>${clients.map(c => `<option value="${c.id}">${c.name}</option>`)}</select><input id="amcVisits" placeholder="Visits/year" type="number"><input id="amcExpiry" placeholder="Expiry YYYY-MM-DD"><div class="modal-actions"><button id="cancelBtn">Cancel</button><button id="saveBtn">Save</button></div></div>`;
    document.body.appendChild(modal);
    document.getElementById('cancelBtn').onclick = () => modal.remove();
    document.getElementById('saveBtn').onclick = async () => {
      const clientId = document.getElementById('amcClient').value;
      const client = clients.find(c => c.id === clientId);
      const visits = parseInt(document.getElementById('amcVisits').value);
      const expiry = document.getElementById('amcExpiry').value;
      if (!clientId || !visits || !expiry) return alert('Complete fields');
      await apiFetch('/amcs', { method: 'POST', body: JSON.stringify({ clientId, clientName: client.name, visitsPerYear: visits, expiry, status: 'Active' }) });
      modal.remove();
      renderDashboard();
    };
  }

  async function showInvoiceModal(clients) {
    const modal = document.createElement('div'); modal.className = 'modal'; modal.style.display = 'flex';
    modal.innerHTML = `<div class="modal-content"><h3>New Invoice</h3><select id="invClient"><option>Select Client</option>${clients.map(c => `<option value="${c.name}">${c.name}</option>`)}</select><input id="invDesc" placeholder="Description"><input id="invAmount" type="number" placeholder="Amount"><div class="modal-actions"><button id="cancelBtn">Cancel</button><button id="saveBtn">Create</button></div></div>`;
    document.body.appendChild(modal);
    document.getElementById('cancelBtn').onclick = () => modal.remove();
    document.getElementById('saveBtn').onclick = async () => {
      const clientName = document.getElementById('invClient').value;
      const desc = document.getElementById('invDesc').value;
      const amount = parseFloat(document.getElementById('invAmount').value);
      if (!clientName || !desc || isNaN(amount)) return alert('Complete');
      await apiFetch('/invoices', { method: 'POST', body: JSON.stringify({ clientName, description: desc, amount, date: new Date().toISOString().slice(0,10) }) });
      modal.remove();
      renderDashboard();
    };
  }

  renderDashboard();
</script>
</body>
</html>
