<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>MaintenanceFlow PRO | HVAC • MEP • Electrical • Plumbing • Civil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f0ede8; --surface: #faf9f7; --surface-2: #f4f1ec;
      --border: #e2ddd6; --text: #1a1714; --text-muted: #8a8279;
      --accent: #d4500a; --accent-light: #f5e6dc;
      --green: #1e6845; --green-light: #d6ede3;
      --amber: #b45309; --amber-light: #fef3c7;
      --red: #dc2626; --red-light: #fee2e2;
      --blue: #1e40af; --blue-light: #dbeafe;
      --shadow: 0 1px 3px rgba(26,23,20,0.06), 0 4px 16px rgba(26,23,20,0.04);
      --radius: 20px; --radius-sm: 12px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .app-layout { display: flex; min-height: 100vh; }
    
    .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 24px 16px; flex-shrink: 0; }
    .sidebar-logo { padding: 0 12px 24px 12px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .sidebar-logo h2 { font-family: 'Syne', sans-serif; font-size: 1.3rem; }
    .sidebar-logo span { color: var(--accent); }
    .sidebar-logo .tagline { font-size: 0.65rem; color: var(--text-muted); margin-top: 4px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 4px; border-radius: 12px; cursor: pointer; transition: all 0.2s; color: var(--text-muted); font-weight: 500; }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active { background: var(--surface-2); color: var(--accent); font-weight: 600; }
    .nav-icon { font-size: 1.2rem; width: 28px; }
    
    .main-content { flex: 1; padding: 24px 28px; overflow-y: auto; }
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; background: var(--surface); border-radius: var(--radius); padding: 20px 28px; margin-bottom: 24px; border: 1px solid var(--border); }
    .user-info { display: flex; gap: 16px; align-items: center; }
    .badge-role { background: var(--surface-2); padding: 6px 14px; border-radius: 40px; font-size: 0.8rem; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); opacity: 0; transition: opacity 0.2s; }
    .stat-card:hover::before { opacity: 1; }
    .stat-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 500; }
    .stat-value { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; margin-top: 8px; }
    
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); margin-bottom: 24px; }
    .card-header { display: flex; justify-content: space-between; margin-bottom: 18px; align-items: center; flex-wrap: wrap; gap: 10px; }
    .card-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.05rem; }
    
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding-bottom: 10px; font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    td { padding: 12px 0; border-bottom: 1px solid var(--surface-2); font-size: 0.85rem; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 100px; font-size: 0.7rem; font-weight: 600; }
    .badge-progress { background: var(--blue-light); color: var(--blue); }
    .badge-completed { background: var(--green-light); color: var(--green); }
    .badge-active { background: var(--green-light); color: var(--green); }
    .badge-renewal { background: var(--amber-light); color: var(--amber); }
    .badge-paid { background: var(--green-light); color: var(--green); }
    .badge-pending { background: var(--amber-light); color: var(--amber); }
    .badge-overdue { background: var(--red-light); color: var(--red); }
    
    .dispatch-card, .amc-item { border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .contract-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 20px; padding: 22px 24px; margin-bottom: 16px; transition: box-shadow 0.2s; cursor: pointer; }
    .contract-card:hover { box-shadow: var(--shadow); border-color: var(--text-muted); }
    .contract-card.expiring { border-color: #fcd34d; background: #fffdf5; }
    .contract-card.expired { border-color: #fca5a5; background: #fff8f8; }
    .progress-bar { height: 6px; background: var(--surface-2); border-radius: 10px; overflow: hidden; margin: 12px 0; }
    .progress-fill { height: 100%; border-radius: 10px; background: var(--green); }
    .progress-fill.amber { background: var(--amber); }
    .progress-fill.red { background: var(--red); }
    
    .kanban-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .tech-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .task-card { border: 1.5px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; background: var(--surface); transition: box-shadow 0.2s; }
    .task-card.urgent { border-left: 4px solid var(--red); }
    .task-card.high { border-left: 4px solid var(--accent); }
    .task-card.medium { border-left: 4px solid var(--amber); }
    .task-card.low { border-left: 4px solid var(--green); }
    .task-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--surface-2); }
    
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(2px); }
    .modal-content { background: var(--surface); max-width: 800px; width: 95%; max-height: 85vh; overflow-y: auto; border-radius: var(--radius); padding: 28px; }
    .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
    .btn-primary { background: var(--text); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: var(--accent); }
    .btn-secondary { background: transparent; border: 1.5px solid var(--border); padding: 10px 20px; border-radius: var(--radius-sm); cursor: pointer; }
    .btn-xs { padding: 4px 10px; border-radius: 8px; border: 1.5px solid var(--border); background: transparent; font-size: 0.7rem; cursor: pointer; }
    .alert-banner { background: var(--amber-light); border: 1.5px solid #fcd34d; border-radius: 14px; padding: 14px 20px; display: flex; align-items: center; gap: 12px; font-size: 0.85rem; color: var(--amber); font-weight: 500; margin-bottom: 20px; }
    .filters-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 20px; }
    .filter-group { display: flex; flex-direction: column; gap: 5px; }
    .search-input, .filter-select { padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-family: inherit; background: var(--surface); }
    
    .auth-container { max-width: 480px; margin: 10vh auto; background: var(--surface); border-radius: var(--radius); padding: 40px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .auth-container h2 { font-family: 'Syne', sans-serif; margin-bottom: 8px; }
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.85rem; }
    input, select { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; background: white; font-family: inherit; }
    .demo-btn { background: transparent; border: 1.5px solid var(--border); padding: 12px; border-radius: 10px; width: 100%; cursor: pointer; margin-bottom: 16px; font-weight: 500; }
    .error-msg { color: #dc2626; font-size: 0.8rem; margin-top: 8px; text-align: center; }
    .auth-toggle { text-align: center; margin-top: 20px; font-size: 0.85rem; }
    .auth-toggle span { color: var(--accent); cursor: pointer; text-decoration: underline; }
    
    @media (max-width: 900px) { .sidebar { width: 80px; } .sidebar-logo h2, .sidebar-logo .tagline, .nav-item span:not(.nav-icon) { display: none; } .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
<div id="app"></div>

<script>
  const API_BASE = window.location.origin + '/api';
  let currentUser = null, authToken = null, currentPage = 'dashboard';

  function getCurrencySymbol(currency) { return currency === 'EUR' ? '€' : 'AED'; }

  async function apiFetch(endpoint, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...options.headers };
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
    const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
    if (res.status === 401) { logout(); throw new Error('Session expired'); }
    if (res.status === 403) { const err = await res.json(); alert(err.error); throw new Error(err.error); }
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  function logout() { localStorage.clear(); authToken = null; currentUser = null; renderLogin(); }

  async function login(email, password) {
    const res = await fetch(`${API_BASE}/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    if (!res.ok) throw new Error('Invalid credentials');
    const data = await res.json();
    authToken = data.token; currentUser = data.user;
    localStorage.setItem('token', authToken); localStorage.setItem('user', JSON.stringify(currentUser));
    renderDashboard();
  }

  async function signup(email, password, company_name, currency) {
    const res = await fetch(`${API_BASE}/auth/signup`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password, company_name, currency }) });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    authToken = data.token; currentUser = data.user;
    localStorage.setItem('token', authToken); localStorage.setItem('user', JSON.stringify(currentUser));
    renderDashboard();
  }

  async function demoLogin() {
    const res = await fetch(`${API_BASE}/auth/demo`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
    if (!res.ok) throw new Error('Demo login failed');
    const data = await res.json();
    authToken = data.token; currentUser = data.user;
    localStorage.setItem('token', authToken); localStorage.setItem('user', JSON.stringify(currentUser));
    renderDashboard();
  }

  function renderLogin() {
    let mode = 'login';
    const update = () => {
      const app = document.getElementById('app');
      if (mode === 'login') {
        app.innerHTML = `<div class="auth-container"><h2>🔧 MaintenanceFlow PRO</h2><div class="sub" style="margin-bottom:20px;">HVAC • MEP • Electrical • Plumbing • Civil</div>
          <button class="demo-btn" id="demoBtn">🚀 Try Demo</button><div style="text-align:center;margin:12px 0;">or</div>
          <div class="input-group"><label>Email</label><input type="email" id="loginEmail"></div>
          <div class="input-group"><label>Password</label><input type="password" id="loginPassword"></div>
          <button class="btn-primary" id="loginBtn" style="width:100%">Sign In</button>
          <div class="auth-toggle">New user? <span id="toggleSignup">Create account</span></div><div id="errorMsg" class="error-msg"></div></div>`;
        document.getElementById('loginBtn').onclick = async () => { try { await login(loginEmail.value, loginPassword.value); } catch(e) { errorMsg.innerText = e.message; } };
        document.getElementById('demoBtn').onclick = async () => { await demoLogin(); };
        document.getElementById('toggleSignup').onclick = () => { mode = 'signup'; update(); };
      } else {
        app.innerHTML = `<div class="auth-container"><h2>🔧 MaintenanceFlow PRO</h2><div class="sub" style="margin-bottom:20px;">Create your account</div>
          <div class="input-group"><label>Company Name</label><input type="text" id="signupCompany"></div>
          <div class="input-group"><label>Email</label><input type="email" id="signupEmail"></div>
          <div class="input-group"><label>Password</label><input type="password" id="signupPassword"></div>
          <div class="input-group"><label>Confirm</label><input type="password" id="signupConfirm"></div>
          <div class="input-group"><label>Currency</label><select id="signupCurrency"><option value="AED">AED (UAE)</option><option value="EUR">EUR (Euro)</option></select></div>
          <button class="btn-primary" id="signupBtn" style="width:100%">Create Account</button>
          <div class="auth-toggle">Already have an account? <span id="toggleLogin">Sign In</span></div><div id="errorMsg" class="error-msg"></div></div>`;
        document.getElementById('signupBtn').onclick = async () => {
          if (signupPassword.value !== signupConfirm.value) { errorMsg.innerText = 'Passwords do not match'; return; }
          try { await signup(signupEmail.value, signupPassword.value, signupCompany.value, signupCurrency.value); } catch(e) { errorMsg.innerText = e.message; }
        };
        document.getElementById('toggleLogin').onclick = () => { mode = 'login'; update(); };
      }
    };
    update();
  }

  function generatePDFInvoice(client, desc, amount) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const sym = getCurrencySymbol(currentUser?.currency);
    doc.text('MaintenanceFlow PRO', 14, 20);
    doc.text(`Invoice #: INV-${Date.now()}`, 14, 30);
    doc.text(`Date: ${new Date().toLocaleDateString()}`, 14, 36);
    doc.autoTable({ startY: 45, head: [['Description', `Amount (${sym})`]], body: [[desc, amount]], theme: 'striped' });
    doc.text(`Customer: ${client}`, 14, doc.lastAutoTable.finalY + 10);
    doc.text(`Total: ${sym} ${amount}`, 14, doc.lastAutoTable.finalY + 18);
    doc.save(`Invoice_${client.replace(/\s/g, '_')}.pdf`);
  }

  async function showJobModal(clients, techs, services) {
    const modal = document.createElement('div'); modal.className = 'modal'; modal.style.display = 'flex';
    modal.innerHTML = `<div class="modal-content"><h3>New Job</h3><select id="jobClient">${clients.map(c => `<option value="${c.id}">${c.name}</option>`)}</select><select id="jobService"><option>${services.map(s => s.name).join('</option><option>')}</option></select><select id="jobPriority"><option>High</option><option>Medium</option><option>Low</option></select><select id="jobTech">${techs.map(t => `<option>${t.name}</option>`)}</select><div class="modal-actions"><button id="cancelBtn">Cancel</button><button id="saveBtn">Create</button></div></div>`;
    document.body.appendChild(modal);
    document.getElementById('cancelBtn').onclick = () => modal.remove();
    document.getElementById('saveBtn').onclick = async () => {
      const client = clients.find(c => c.id === jobClient.value);
      await apiFetch('/jobs', { method: 'POST', body: JSON.stringify({ customerId: client.id, customerName: client.name, service: jobService.value, technician: jobTech.value, priority: jobPriority.value, status: 'Assigned' }) });
      modal.remove(); renderDashboard();
    };
  }

  async function showAmcModal(clients) {
    const modal = document.createElement('div'); modal.className = 'modal'; modal.style.display = 'flex';
    modal.innerHTML = `<div class="modal-content"><h3>New AMC</h3><select id="amcClient">${clients.map(c => `<option value="${c.id}">${c.name}</option>`)}</select><input id="amcVisits" placeholder="Visits/year" type="number"><input id="amcExpiry" placeholder="Expiry YYYY-MM-DD"><div class="modal-actions"><button id="cancelBtn">Cancel</button><button id="saveBtn">Save</button></div></div>`;
    document.body.appendChild(modal);
    document.getElementById('cancelBtn').onclick = () => modal.remove();
    document.getElementById('saveBtn').onclick = async () => {
      const client = clients.find(c => c.id === amcClient.value);
      await apiFetch('/amcs', { method: 'POST', body: JSON.stringify({ clientId: client.id, clientName: client.name, visitsPerYear: parseInt(amcVisits.value), expiry: amcExpiry.value, status: 'Active' }) });
      modal.remove(); renderDashboard();
    };
  }

  async function showInvoiceModal(clients) {
    let services = [];
    try {
      services = await apiFetch('/services');
    } catch(e) { console.error('Could not load services'); }
    
    const modal = document.createElement('div');
    modal.className = 'modal';
    modal.style.display = 'flex';
    modal.style.alignItems = 'center';
    modal.style.justifyContent = 'center';
    
    modal.innerHTML = `
      <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
          <h3 style="font-family: 'Syne', sans-serif; font-size: 1.3rem;">🧾 Create New Invoice</h3>
          <button id="closeModalBtn" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted);">&times;</button>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
          <div><label style="display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 5px;">CLIENT NAME *</label>
          <input type="text" id="invClientName" placeholder="e.g. Al Noor Villa" list="clientList" style="width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px;">
          <datalist id="clientList">${clients.map(c => `<option value="${c.name}">`).join('')}</datalist></div>
          <div><label style="display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 5px;">INVOICE DATE *</label>
          <input type="date" id="invDate" style="width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px;"></div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
          <div><label style="display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 5px;">DUE DATE</label>
          <input type="date" id="invDueDate" style="width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px;"></div>
          <div><label style="display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 5px;">RELATED TICKET / AMC</label>
          <input type="text" id="invRef" placeholder="e.g. TKT-260519-2442" style="width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px;"></div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
          <div><label style="display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 5px;">PAYMENT TERMS</label>
          <select id="invTerms" style="width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px;">
            <option>Due on Receipt</option><option>Net 7 Days</option><option>Net 14 Days</option><option>Net 30 Days</option>
          </select></div>
          <div><label style="display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 5px;">TRN NUMBER (VAT)</label>
          <input type="text" id="invTrn" placeholder="Your company TRN" style="width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px;"></div>
        </div>
        
        <div style="margin-top: 20px;">
          <div style="font-family: 'Syne', sans-serif; font-size: 0.9rem; font-weight: 700; margin-bottom: 12px;">Line Items</div>
          <div style="display: grid; grid-template-columns: 2fr 0.8fr 0.8fr 0.8fr 0.8fr 40px; gap: 12px; padding: 10px 0; margin-bottom: 8px; font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600;">
            <span>Service / Item</span><span>Qty</span><span>Unit Price</span><span>Total</span><span>Notes</span><span></span>
          </div>
          
          <datalist id="serviceList">${services.map(s => `<option value="${s.name}">`).join('')}</datalist>
          
          <div id="lineItemsContainer"></div>
          <button id="addLineItemBtn" style="margin-top: 12px; padding: 8px 16px; border: 1.5px dashed var(--border); border-radius: 10px; background: transparent; cursor: pointer; width: 100%;">+ Add Line Item</button>
        </div>
        
        <div id="totalsPanel" style="margin-top: 24px; border: 1.5px solid var(--border); border-radius: 14px; overflow: hidden;">
          <div style="display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border);"><span>Subtotal</span><span id="subtotalAmount" style="font-weight: 600;">AED 0.00</span></div>
          <div style="display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border);"><span>VAT (5%)</span><span id="vatAmount" style="font-weight: 600;">AED 0.00</span></div>
          <div style="display: flex; justify-content: space-between; padding: 12px 16px; background: var(--surface-2); font-weight: 700;"><span>Total</span><span id="totalAmount">AED 0.00</span></div>
        </div>
        
        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
          <button id="cancelInvBtn" class="btn-secondary">Save as Draft</button>
          <button id="previewInvBtn" class="btn-secondary">Preview PDF</button>
          <button id="sendInvBtn" class="btn-primary">Send Invoice</button>
          <button id="closeModalBtn2" class="btn-secondary">Close</button>
        </div>
      </div>
    `;
    
    document.body.appendChild(modal);
    
    let lineItems = [{ service: '', qty: 1, unitPrice: 0, notes: '' }];
    
    function renderLineItems() {
      const container = document.getElementById('lineItemsContainer');
      if (!container) return;
      container.innerHTML = lineItems.map((item, idx) => `
        <div class="line-item-row" data-idx="${idx}" style="display: grid; grid-template-columns: 2fr 0.8fr 0.8fr 0.8fr 0.8fr 40px; gap: 12px; align-items: center; margin-bottom: 8px;">
          <input type="text" class="item-service" value="${item.service.replace(/"/g, '&quot;')}" placeholder="e.g. AC Maintenance" list="serviceList" style="padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px;">
          <input type="number" class="item-qty" value="${item.qty}" step="1" style="padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px;">
          <input type="number" class="item-price" value="${item.unitPrice}" step="0.01" style="padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px;">
          <div class="item-total" style="font-weight: 600; padding: 8px 0;">${(item.qty * item.unitPrice).toFixed(2)}</div>
          <input type="text" class="item-notes" value="${item.notes.replace(/"/g, '&quot;')}" placeholder="Additional details..." style="padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px;">
          <button class="remove-item" style="width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid var(--border); background: transparent; cursor: pointer;">✕</button>
        </div>
      `).join('');
      
      document.querySelectorAll('.item-service, .item-qty, .item-price, .item-notes').forEach(input => {
        input.removeEventListener('input', updateTotals);
        input.addEventListener('input', updateTotals);
      });
      document.querySelectorAll('.remove-item').forEach(btn => {
        btn.removeEventListener('click', removeItem);
        btn.addEventListener('click', removeItem);
      });
      updateTotals();
    }
    
    function removeItem(e) {
      const row = e.target.closest('.line-item-row');
      if (row) {
        const idx = parseInt(row.dataset.idx);
        lineItems.splice(idx, 1);
        if (lineItems.length === 0) lineItems = [{ service: '', qty: 1, unitPrice: 0, notes: '' }];
        renderLineItems();
      }
    }
    
    function updateTotals() {
      const rows = document.querySelectorAll('.line-item-row');
      lineItems = [];
      rows.forEach(row => {
        const service = row.querySelector('.item-service')?.value || '';
        const qty = parseFloat(row.querySelector('.item-qty')?.value) || 0;
        const price = parseFloat(row.querySelector('.item-price')?.value) || 0;
        const notes = row.querySelector('.item-notes')?.value || '';
        lineItems.push({ service, qty, unitPrice: price, notes });
        const totalSpan = row.querySelector('.item-total');
        if (totalSpan) totalSpan.innerText = (qty * price).toFixed(2);
      });
      if (lineItems.length === 0) lineItems = [{ service: '', qty: 1, unitPrice: 0, notes: '' }];
      
      const subtotal = lineItems.reduce((sum, item) => sum + (item.qty * item.unitPrice), 0);
      const vat = subtotal * 0.05;
      const total = subtotal + vat;
      
      document.getElementById('subtotalAmount').innerText = `AED ${subtotal.toFixed(2)}`;
      document.getElementById('vatAmount').innerText = `AED ${vat.toFixed(2)}`;
      document.getElementById('totalAmount').innerText = `AED ${total.toFixed(2)}`;
    }
    
    renderLineItems();
    
    const closeModal = () => modal.remove();
    document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
    document.getElementById('closeModalBtn2')?.addEventListener('click', closeModal);
    
    document.getElementById('addLineItemBtn').onclick = () => {
      lineItems.push({ service: '', qty: 1, unitPrice: 0, notes: '' });
      renderLineItems();
    };
    
    document.getElementById('cancelInvBtn').onclick = () => {
      closeModal();
    };
    
    document.getElementById('previewInvBtn').onclick = () => {
      const clientName = document.getElementById('invClientName').value;
      if (!clientName) { alert('Please enter client name'); return; }
      const validItems = lineItems.filter(i => i.service);
      if (validItems.length === 0) { alert('Please add at least one line item'); return; }
      const subtotal = validItems.reduce((s, i) => s + (i.qty * i.unitPrice), 0);
      const vat = subtotal * 0.05;
      const total = subtotal + vat;
      const sym = getCurrencySymbol(currentUser?.currency);
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(18); doc.text('MaintenanceFlow PRO', 14, 20);
      doc.setFontSize(10); doc.text(`Invoice: PREVIEW-${Date.now()}`, 14, 30);
      doc.text(`Date: ${new Date().toLocaleDateString()}`, 14, 36);
      doc.text(`Client: ${clientName}`, 14, 44);
      doc.autoTable({ startY: 52, head: [['Service', 'Qty', 'Unit Price', 'Amount', 'Notes']], body: validItems.map(i => [i.service, i.qty, `${sym}${i.unitPrice.toFixed(2)}`, `${sym}${(i.qty * i.unitPrice).toFixed(2)}`, i.notes]), theme: 'striped' });
      const y = doc.lastAutoTable.finalY + 10;
      doc.text(`Subtotal: ${sym} ${subtotal.toFixed(2)}`, 140, y);
      doc.text(`VAT (5%): ${sym} ${vat.toFixed(2)}`, 140, y + 6);
      doc.text(`Total: ${sym} ${total.toFixed(2)}`, 140, y + 12);
      doc.save(`Invoice_${clientName.replace(/\s/g, '_')}_preview.pdf`);
    };
    
    document.getElementById('sendInvBtn').onclick = async () => {
      const clientName = document.getElementById('invClientName').value;
      if (!clientName) { alert('Client name required'); return; }
      const validItems = lineItems.filter(i => i.service && i.qty > 0 && i.unitPrice > 0);
      if (validItems.length === 0) { alert('Please add at least one valid line item'); return; }
      
      const description = validItems.map(i => {
        if (i.notes) return `${i.service} (${i.notes})`;
        return i.service;
      }).join(', ');
      
      const subtotal = validItems.reduce((s, i) => s + (i.qty * i.unitPrice), 0);
      const total = subtotal * 1.05;
      try {
        await apiFetch('/invoices', {
          method: 'POST',
          body: JSON.stringify({
            client_name: clientName,
            description: description,
            amount: total,
            date: document.getElementById('invDate').value || new Date().toISOString().slice(0,10),
            due_date: document.getElementById('invDueDate').value || null,
            line_items: validItems.map(item => ({ 
              description: item.service + (item.notes ? ' - ' + item.notes : ''), 
              quantity: item.qty, 
              unit_price: item.unitPrice 
            })),
            payment_terms: document.getElementById('invTerms').value,
            trn_number: document.getElementById('invTrn').value,
            reference: document.getElementById('invRef').value
          })
        });
        closeModal();
        renderDashboard();
        alert('Invoice created successfully!');
      } catch (err) { alert('Error: ' + err.message); }
    };
  }

  async function renderDashboard() {
    const app = document.getElementById('app');
    const isAdmin = currentUser?.role === 'admin';
    const sym = getCurrencySymbol(currentUser?.currency);
    let jobs = [], amcs = [], invoices = [], clients = [], techs = [], services = [];
    try { [jobs, amcs, invoices, clients, techs, services] = await Promise.all([apiFetch('/jobs'), apiFetch('/amcs'), apiFetch('/invoices'), apiFetch('/clients'), apiFetch('/technicians'), apiFetch('/services')]); } catch(e) { console.error(e); }
    const openJobs = jobs.filter(j => j.status !== 'Completed').length;
    const totalRevenue = invoices.reduce((s,i) => s + i.amount, 0);
    const activeTechs = techs.filter(t => t.active).length;
    const expiringCount = amcs.filter(a => a.status === 'Renewal Due').length;
    const overdueInvoices = invoices.filter(i => i.status === 'Overdue').length;

    app.innerHTML = `
      <div class="app-layout">
        <div class="sidebar">
          <div class="sidebar-logo"><h2>Maint<span>Flow</span></h2><div class="tagline">HVAC • MEP • Civil</div></div>
          <div class="nav-item ${currentPage === 'dashboard' ? 'active' : ''}" data-page="dashboard"><span class="nav-icon">📊</span> <span>Dashboard</span></div>
          <div class="nav-item ${currentPage === 'amc' ? 'active' : ''}" data-page="amc"><span class="nav-icon">📑</span> <span>AMC Contracts</span></div>
          <div class="nav-item ${currentPage === 'tasks' ? 'active' : ''}" data-page="tasks"><span class="nav-icon">⚡</span> <span>Assigned Tasks</span></div>
          <div class="nav-item ${currentPage === 'invoices' ? 'active' : ''}" data-page="invoices"><span class="nav-icon">🧾</span> <span>Invoices</span></div>
          <div><div class="nav-item" data-page="customers"><span class="nav-icon">👥</span> <span>Customers</span></div>
          <div class="nav-item" data-page="technicians"><span class="nav-icon">🔧</span> <span>Technicians</span></div>
          <div class="nav-item" data-page="services"><span class="nav-icon">📋</span> <span>Services</span></div></div>
        </div>
        <div class="main-content">
          <div class="dashboard-header"><div><h1>Maintenance<span style="color:var(--accent)">Flow</span> PRO</h1></div>
          <div class="user-info"><span class="badge-role">👤 ${currentUser.company_name} (${currentUser.role})</span><button id="logoutBtn" class="btn-secondary">Logout</button></div></div>
          <div id="page-container"></div>
        </div>
      </div>`;
    const container = document.getElementById('page-container');

    if (currentPage === 'dashboard') {
      container.innerHTML = `<div class="stats-grid"><div class="stat-card"><div class="stat-label">Open Jobs</div><div class="stat-value">${openJobs}</div></div>
        <div class="stat-card"><div class="stat-label">AMC Contracts</div><div class="stat-value">${amcs.length}</div></div>
        <div class="stat-card"><div class="stat-label">Active Techs</div><div class="stat-value">${activeTechs}</div></div>
        <div class="stat-card"><div class="stat-label">Revenue (${sym})</div><div class="stat-value">${sym} ${totalRevenue.toLocaleString()}</div></div></div>
        <div class="card"><div class="card-header"><div class="card-title">📋 Recent Jobs</div><button id="newJobBtn" class="btn-secondary">+ New Job</button></div> <table><thead><tr><th>Customer</th><th>Service</th><th>Technician</th><th>Status</th></tr></thead><tbody id="recentJobsBody"></tbody></table></div>
        <div class="card"><div class="card-title">👨‍🔧 Technicians</div><div id="dispatchList"></div></div>`;
      const tbody = document.getElementById('recentJobsBody');
      jobs.slice(0,5).forEach(job => { const row = tbody.insertRow(); row.insertCell(0).innerHTML = job.customer_name; row.insertCell(1).innerHTML = job.service; row.insertCell(2).innerHTML = job.technician; row.insertCell(3).innerHTML = `<span class="badge ${job.status==='Completed'?'badge-completed':'badge-progress'}">${job.status}</span>`; });
      const dispatchDiv = document.getElementById('dispatchList');
      dispatchDiv.innerHTML = '';
      techs.forEach(tech => { const assigned = jobs.filter(j => j.technician === tech.name && j.status !== 'Completed').length; dispatchDiv.innerHTML += `<div class="dispatch-card"><div><strong>${tech.name}</strong><div style="font-size:0.7rem;">${tech.role}</div></div><div>${assigned} jobs</div></div>`; });
      document.getElementById('newJobBtn')?.addEventListener('click', () => showJobModal(clients, techs, services));
    } 
    else if (currentPage === 'amc') {
      container.innerHTML = `<div class="stats-grid"><div class="stat-card"><div class="stat-label">Total Contracts</div><div class="stat-value">${amcs.length}</div></div>
        <div class="stat-card"><div class="stat-label">Active</div><div class="stat-value" style="color:var(--green)">${amcs.filter(a => a.status === 'Active').length}</div></div>
        <div class="stat-card"><div class="stat-label">Expiring Soon</div><div class="stat-value" style="color:var(--amber)">${expiringCount}</div></div>
        <div class="stat-card"><div class="stat-label">Expired</div><div class="stat-value" style="color:var(--red)">${amcs.filter(a => a.status === 'Expired').length}</div></div></div>
        ${expiringCount > 0 ? `<div class="alert-banner"><span>⚠️</span><div><strong>${expiringCount} contracts expiring soon.</strong> Send renewal reminders.</div><div class="alert-action" style="text-decoration:underline;cursor:pointer;">Send Reminders →</div></div>` : ''}
        <div class="card"><div class="card-header"><div class="card-title">📑 AMC Contracts</div><button id="newAmcBtn" class="btn-secondary">+ Add Contract</button></div><div id="amcList"></div></div>`;
      const amcDiv = document.getElementById('amcList');
      amcDiv.innerHTML = amcs.map(a => `<div class="contract-card ${a.status === 'Renewal Due' ? 'expiring' : ''} ${a.status === 'Expired' ? 'expired' : ''}">
        <div style="display:flex;justify-content:space-between;"><div><strong>${a.client_name}</strong></div><span class="badge ${a.status === 'Active' ? 'badge-active' : (a.status === 'Renewal Due' ? 'badge-renewal' : 'badge-expired')}">${a.status}</span></div>
        <div style="margin:12px 0;"><div>Contract Value: ${sym} ${(a.visits_per_year * 500).toLocaleString()} / year</div><div>Visits: ${a.visits_per_year} / year</div><div>Expiry: ${a.expiry}</div></div>
        <div class="progress-bar"><div class="progress-fill ${a.status === 'Renewal Due' ? 'amber' : (a.status === 'Expired' ? 'red' : 'green')}" style="width:${Math.min(100, (new Date() - new Date(a.expiry)) / (365 * 24 * 60 * 60 * 1000) * 100)}%"></div></div>
        <div style="display:flex;gap:8px;margin-top:16px;"><button class="btn-xs">View Details</button><button class="btn-xs">Log Visit</button><button class="btn-xs btn-primary">Renew</button></div></div>`).join('');
      document.getElementById('newAmcBtn')?.addEventListener('click', () => showAmcModal(clients));
    }
    else if (currentPage === 'tasks') {
      container.innerHTML = `<div class="stats-grid"><div class="stat-card"><div class="stat-label">Total Tasks Today</div><div class="stat-value">${jobs.length}</div></div>
        <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value" style="color:var(--amber)">${jobs.filter(j => j.status === 'Assigned').length}</div></div>
        <div class="stat-card"><div class="stat-label">In Progress</div><div class="stat-value" style="color:var(--blue)">${jobs.filter(j => j.status === 'In Progress').length}</div></div>
        <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value" style="color:var(--green)">${jobs.filter(j => j.status === 'Completed').length}</div></div></div>
        <div class="card"><div class="card-title">⚡ Assigned Tasks by Technician</div><div class="kanban-grid" id="kanbanGrid"></div></div>`;
      const grid = document.getElementById('kanbanGrid');
      grid.innerHTML = techs.map(tech => `<div class="tech-card"><div><strong>${tech.name}</strong> (${tech.role})</div><div style="margin-top:12px;">${jobs.filter(j => j.technician === tech.name).map(j => `<div class="task-card ${j.priority?.toLowerCase() || 'medium'}"><div><strong>${j.customer_name}</strong></div><div>${j.service}</div><div class="task-footer"><span>${j.status}</span><button class="btn-xs" onclick="alert('Update status')">Update</button></div></div>`).join('') || '<div style="color:var(--text-muted);">No tasks</div>'}</div></div>`).join('');
    }
    else if (currentPage === 'invoices') {
      const totalInvoiced = invoices.reduce((s,i) => s + i.amount, 0);
      const paidAmount = invoices.filter(i => i.status === 'Paid').reduce((s,i) => s + i.amount, 0);
      const pendingAmount = totalInvoiced - paidAmount;
      container.innerHTML = `<div class="stats-grid"><div class="stat-card"><div class="stat-label">Total Invoiced</div><div class="stat-value">${sym} ${totalInvoiced.toLocaleString()}</div></div>
        <div class="stat-card"><div class="stat-label">Collected</div><div class="stat-value" style="color:var(--green)">${sym} ${paidAmount.toLocaleString()}</div></div>
        <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value" style="color:var(--amber)">${sym} ${pendingAmount.toLocaleString()}</div></div>
        <div class="stat-card"><div class="stat-label">Overdue</div><div class="stat-value" style="color:var(--red)">${sym} ${invoices.filter(i => i.status === 'Overdue').reduce((s,i) => s + i.amount, 0)}</div></div></div>
        ${overdueInvoices > 0 ? `<div class="alert-banner"><span>🔴</span><div><strong>${overdueInvoices} invoices are overdue.</strong> Send payment reminders.</div><div class="alert-action" style="text-decoration:underline;cursor:pointer;">Send Reminders →</div></div>` : ''}
        <div class="card"><div class="card-header"><div class="card-title">🧾 Invoices</div><button id="newInvoiceBtn" class="btn-secondary">+ Create Invoice</button></div>
        <div style="overflow-x:auto;"><table><thead><tr><th>Invoice #</th><th>Client</th><th>Description</th><th>Amount (${sym})</th><th>Date</th><th>Status</th><th>PDF</th></tr></thead><tbody id="invoiceListBody"></tbody></table></div></div>`;
      const invBody = document.getElementById('invoiceListBody');
      invoices.forEach((inv, idx) => {
        const row = invBody.insertRow();
        row.insertCell(0).innerHTML = inv.invoice_number || `INV-${new Date(inv.date).getFullYear()}-${String(idx+1).padStart(4,'0')}`;
        row.insertCell(1).innerHTML = inv.client_name;
        row.insertCell(2).innerHTML = inv.description;
        row.insertCell(3).innerHTML = `${sym} ${inv.amount}`;
        row.insertCell(4).innerHTML = inv.date;
        row.insertCell(5).innerHTML = `<span class="badge ${inv.status === 'Paid' ? 'badge-paid' : (inv.status === 'Overdue' ? 'badge-overdue' : 'badge-pending')}">${inv.status || 'Pending'}</span>`;
        row.insertCell(6).innerHTML = `<button class="btn-xs" data-inv='${JSON.stringify(inv)}'>PDF</button>`;
        row.cells[6].querySelector('button').onclick = () => generatePDFInvoice(inv.client_name, inv.description, inv.amount);
      });
      document.getElementById('newInvoiceBtn')?.addEventListener('click', () => showInvoiceModal(clients));
    }
    else if (currentPage === 'customers') {
      container.innerHTML = `<div class="card"><div class="card-header"><div class="card-title">👥 Customers</div><button id="newCustomerBtn" class="btn-secondary">+ Add Customer</button></div><table><thead><tr><th>Name</th><th>Contact</th><th>Address</th></tr></thead><tbody>${clients.map(c => `<tr><td>${c.name}</td><td>${c.contact || '-'}</td><td>${c.address || '-'}</td>`).join('')}</tbody></table></div>`;
      document.getElementById('newCustomerBtn')?.addEventListener('click', async () => {
        const name = prompt('Customer name:'); if(!name) return;
        const contact = prompt('Contact:'); const address = prompt('Address:');
        await apiFetch('/clients', { method: 'POST', body: JSON.stringify({ name, contact, address }) });
        renderDashboard();
      });
    }
    else if (currentPage === 'technicians') {
      container.innerHTML = `<div class="card"><div class="card-header"><div class="card-title">🔧 Technicians</div><button id="newTechBtn" class="btn-secondary">+ Add Technician</button></div></table><thead><tr><th>Name</th><th>Role</th><th>Active</th></tr></thead><tbody>${techs.map(t => `<tr><td>${t.name}</td><td>${t.role || '-'}</td><td>${t.active ? '✅' : '❌'}</td>`).join('')}</tbody></table></div>`;
      document.getElementById('newTechBtn')?.addEventListener('click', async () => {
        const name = prompt('Technician name:'); if(!name) return;
        const role = prompt('Role:'); await apiFetch('/technicians', { method: 'POST', body: JSON.stringify({ name, role, active: true }) });
        renderDashboard();
      });
    }
    else if (currentPage === 'services') {
      container.innerHTML = `<div class="card"><div class="card-header"><div class="card-title">📋 Services</div><button id="newServiceBtn" class="btn-secondary">+ Add Service</button></div><table><thead><tr><th>Service Name</th></tr></thead><tbody>${services.map(s => `<tr><td>${s.name}</td></tr>`).join('')}</tbody></table></div>`;
      document.getElementById('newServiceBtn')?.addEventListener('click', async () => {
        const name = prompt('Service name:'); if(!name) return;
        await apiFetch('/services', { method: 'POST', body: JSON.stringify({ name }) });
        renderDashboard();
      });
    }

    document.querySelectorAll('.nav-item[data-page]').forEach(el => { el.addEventListener('click', () => { currentPage = el.dataset.page; renderDashboard(); }); });
    document.getElementById('logoutBtn')?.addEventListener('click', logout);
  }

  const savedToken = localStorage.getItem('token');
  const savedUser = localStorage.getItem('user');
  if (savedToken && savedUser) { authToken = savedToken; currentUser = JSON.parse(savedUser); renderDashboard().catch(() => renderLogin()); } 
  else { renderLogin(); }
</script>
</body>
</html>
