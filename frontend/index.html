<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>MaintenanceFlow PRO | ERP for SMEs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f0ede8;
      --surface: #faf9f7;
      --surface-2: #f4f1ec;
      --border: #e2ddd6;
      --text: #1a1714;
      --text-muted: #8a8279;
      --accent: #d4500a;
      --green: #1e6845;
      --green-light: #d6ede3;
      --blue-light: #dbeafe;
      --shadow: 0 1px 3px rgba(26,23,20,0.06), 0 4px 16px rgba(26,23,20,0.04);
      --radius: 20px;
      --radius-sm: 12px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    
    .app-layout { display: flex; min-height: 100vh; }
    
    .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 24px 16px; flex-shrink: 0; }
    .sidebar-logo { padding: 0 12px 24px 12px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .sidebar-logo h2 { font-family: 'Syne', sans-serif; font-size: 1.3rem; }
    .sidebar-logo span { color: var(--accent); }
    .sidebar-logo .tagline { font-size: 0.65rem; color: var(--text-muted); margin-top: 4px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 4px; border-radius: 12px; cursor: pointer; transition: all 0.2s; color: var(--text-muted); font-weight: 500; }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active { background: var(--surface-2); color: var(--accent); font-weight: 600; }
    .nav-icon { font-size: 1.2rem; width: 28px; }
    .nav-sub { margin-left: 28px; padding-left: 16px; border-left: 1px solid var(--border); }
    
    .main-content { flex: 1; padding: 24px 28px; overflow-y: auto; }
    
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; background: var(--surface); border-radius: var(--radius); padding: 20px 28px; margin-bottom: 24px; border: 1px solid var(--border); }
    .user-info { display: flex; gap: 16px; align-items: center; }
    .badge-role { background: var(--surface-2); padding: 6px 14px; border-radius: 40px; font-size: 0.8rem; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; box-shadow: var(--shadow); }
    .stat-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 500; }
    .stat-value { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; margin-top: 8px; }
    
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); margin-bottom: 24px; }
    .card-header { display: flex; justify-content: space-between; margin-bottom: 18px; align-items: center; }
    .card-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.05rem; }
    
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding-bottom: 10px; font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    td { padding: 12px 0; border-bottom: 1px solid var(--surface-2); font-size: 0.85rem; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 40px; font-size: 0.7rem; }
    .badge-progress { background: var(--blue-light); color: var(--blue); }
    .badge-completed { background: var(--green-light); color: var(--green); }
    .dispatch-card, .amc-item { border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(2px); }
    .modal-content { background: var(--surface); max-width: 500px; width: 90%; border-radius: var(--radius); padding: 28px; }
    .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
    
    .btn-primary { background: var(--text); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: var(--accent); }
    .btn-secondary { background: transparent; border: 1.5px solid var(--border); padding: 10px 20px; border-radius: var(--radius-sm); cursor: pointer; }
    
    .page-content { display: none; }
    .page-content.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .kanban-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .tech-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    
    @media (max-width: 900px) {
      .sidebar { width: 80px; padding: 16px 8px; }
      .sidebar-logo h2, .sidebar-logo .tagline, .nav-item span:not(.nav-icon) { display: none; }
      .nav-item { justify-content: center; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .main-content { padding: 16px; }
    }
    
    /* Login styles */
    .auth-container { max-width: 480px; margin: 10vh auto; background: var(--surface); border-radius: var(--radius); padding: 40px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .auth-container h2 { font-family: 'Syne', sans-serif; margin-bottom: 8px; }
    .auth-container .sub { color: var(--text-muted); margin-bottom: 28px; font-size: 0.85rem; }
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.85rem; }
    input, select { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; background: white; font-family: inherit; }
    .demo-btn { background: transparent; border: 1.5px solid var(--border); padding: 12px; border-radius: 10px; width: 100%; cursor: pointer; margin-bottom: 16px; font-weight: 500; }
    .error-msg { color: #dc2626; font-size: 0.8rem; margin-top: 8px; text-align: center; }
    .auth-toggle { text-align: center; margin-top: 20px; font-size: 0.85rem; }
    .auth-toggle span { color: var(--accent); cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
<div id="app"></div>

<script>
  const API_BASE = window.location.origin + '/api';
  let currentUser = null;
  let authToken = null;
  let currentPage = 'dashboard';

  function getCurrencySymbol(currency) { return currency === 'EUR' ? '€' : 'AED'; }

  async function apiFetch(endpoint, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...options.headers };
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
    const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
    if (res.status === 401) { logout(); throw new Error('Session expired'); }
    if (res.status === 403) { const error = await res.json(); alert(error.error); throw new Error(error.error); }
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  function logout() { localStorage.clear(); authToken = null; currentUser = null; renderLogin(); }

  async function login(email, password) {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    if (!res.ok) throw new Error('Invalid credentials');
    const data = await res.json();
    authToken = data.token; currentUser = data.user;
    localStorage.setItem('token', authToken); localStorage.setItem('user', JSON.stringify(currentUser));
    renderDashboard();
  }

  async function signup(email, password, company_name, currency) {
    const res = await fetch(`${API_BASE}/auth/signup`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, company_name, currency })
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    authToken = data.token; currentUser = data.user;
    localStorage.setItem('token', authToken); localStorage.setItem('user', JSON.stringify(currentUser));
    renderDashboard();
  }

  async function demoLogin() {
    const res = await fetch(`${API_BASE}/auth/demo`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
    if (!res.ok) throw new Error('Demo login failed');
    const data = await res.json();
    authToken = data.token; currentUser = data.user;
    localStorage.setItem('token', authToken); localStorage.setItem('user', JSON.stringify(currentUser));
    renderDashboard();
  }

  function renderLogin() {
    let mode = 'login';
    const updateForm = () => {
      const app = document.getElementById('app');
      if (mode === 'login') {
        app.innerHTML = `
          <div class="auth-container">
            <h2>🔧 MaintenanceFlow PRO</h2>
            <div class="sub">HVAC • MEP • Electrical • Plumbing • Civil</div>
            <button class="demo-btn" id="demoBtn">🚀 Try Demo</button>
            <div style="text-align:center; margin:12px 0;">or</div>
            <div class="input-group"><label>Email</label><input type="email" id="loginEmail"></div>
            <div class="input-group"><label>Password</label><input type="password" id="loginPassword"></div>
            <button class="btn-primary" id="loginBtn">Sign In</button>
            <div class="auth-toggle">New user? <span id="toggleSignup">Create account</span></div>
            <div id="errorMsg" class="error-msg"></div>
          </div>`;
        document.getElementById('loginBtn').onclick = async () => {
          try { await login(loginEmail.value, loginPassword.value); } 
          catch(e) { document.getElementById('errorMsg').innerText = e.message; }
        };
        document.getElementById('demoBtn').onclick = async () => { await demoLogin(); };
        document.getElementById('toggleSignup').onclick = () => { mode = 'signup'; updateForm(); };
      } else {
        app.innerHTML = `
          <div class="auth-container">
            <h2>🔧 MaintenanceFlow PRO</h2>
            <div class="sub">Create your account</div>
            <div class="input-group"><label>Company Name</label><input type="text" id="signupCompany"></div>
            <div class="input-group"><label>Email</label><input type="email" id="signupEmail"></div>
            <div class="input-group"><label>Password</label><input type="password" id="signupPassword"></div>
            <div class="input-group"><label>Confirm Password</label><input type="password" id="signupConfirm"></div>
            <div class="input-group"><label>Currency</label><select id="signupCurrency"><option value="AED">AED (UAE)</option><option value="EUR">EUR (Euro)</option></select></div>
            <button class="btn-primary" id="signupBtn">Create Account</button>
            <div class="auth-toggle">Already have an account? <span id="toggleLogin">Sign In</span></div>
            <div id="errorMsg" class="error-msg"></div>
          </div>`;
        document.getElementById('signupBtn').onclick = async () => {
          const pwd = signupPassword.value, confirm = signupConfirm.value;
          if (pwd !== confirm) { errorMsg.innerText = 'Passwords do not match'; return; }
          try { await signup(signupEmail.value, pwd, signupCompany.value, signupCurrency.value); } 
          catch(e) { errorMsg.innerText = e.message; }
        };
        document.getElementById('toggleLogin').onclick = () => { mode = 'login'; updateForm(); };
      }
    };
    updateForm();
  }

  function generatePDFInvoice(client, desc, amount) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const symbol = getCurrencySymbol(currentUser?.currency);
    doc.text('MaintenanceFlow PRO', 14, 20);
    doc.text(`Invoice #: INV-${Date.now()}`, 14, 30);
    doc.text(`Date: ${new Date().toLocaleDateString()}`, 14, 36);
    doc.autoTable({ startY: 45, head: [['Description', `Amount (${symbol})`]], body: [[desc, amount]], theme: 'striped' });
    doc.text(`Customer: ${client}`, 14, doc.lastAutoTable.finalY + 10);
    doc.text(`Total: ${symbol} ${amount}`, 14, doc.lastAutoTable.finalY + 18);
    doc.save(`Invoice_${client.replace(/\s/g, '_')}.pdf`);
  }

  async function showJobModal(clients, techs, services) {
    const modal = document.createElement('div'); modal.className = 'modal'; modal.style.display = 'flex';
    modal.innerHTML = `<div class="modal-content"><h3>New Job</h3><select id="jobClient">${clients.map(c => `<option value="${c.id}">${c.name}</option>`)}</select><input id="jobService" placeholder="Service"><select id="jobPriority"><option>High</option><option>Medium</option><option>Low</option></select><select id="jobTech">${techs.map(t => `<option>${t.name}</option>`)}</select><div class="modal-actions"><button id="cancelBtn">Cancel</button><button id="saveBtn">Create</button></div></div>`;
    document.body.appendChild(modal);
    document.getElementById('cancelBtn').onclick = () => modal.remove();
    document.getElementById('saveBtn').onclick = async () => {
      const client = clients.find(c => c.id === jobClient.value);
      await apiFetch('/jobs', { method: 'POST', body: JSON.stringify({ customerId: client.id, customerName: client.name, service: jobService.value, technician: jobTech.value, priority: jobPriority.value, status: 'Assigned' }) });
      modal.remove(); renderDashboard();
    };
  }

  async function showAmcModal(clients) {
    const modal = document.createElement('div'); modal.className = 'modal'; modal.style.display = 'flex';
    modal.innerHTML = `<div class="modal-content"><h3>New AMC</h3><select id="amcClient">${clients.map(c => `<option value="${c.id}">${c.name}</option>`)}</select><input id="amcVisits" placeholder="Visits/year" type="number"><input id="amcExpiry" placeholder="Expiry YYYY-MM-DD"><div class="modal-actions"><button id="cancelBtn">Cancel</button><button id="saveBtn">Save</button></div></div>`;
    document.body.appendChild(modal);
    document.getElementById('cancelBtn').onclick = () => modal.remove();
    document.getElementById('saveBtn').onclick = async () => {
      const client = clients.find(c => c.id === amcClient.value);
      await apiFetch('/amcs', { method: 'POST', body: JSON.stringify({ clientId: client.id, clientName: client.name, visitsPerYear: parseInt(amcVisits.value), expiry: amcExpiry.value, status: 'Active' }) });
      modal.remove(); renderDashboard();
    };
  }

  async function showInvoiceModal(clients) {
    const modal = document.createElement('div'); modal.className = 'modal'; modal.style.display = 'flex';
    modal.innerHTML = `<div class="modal-content"><h3>New Invoice</h3><select id="invClient">${clients.map(c => `<option value="${c.name}">${c.name}</option>`)}</select><input id="invDesc" placeholder="Description"><input id="invAmount" type="number" placeholder="Amount"><div class="modal-actions"><button id="cancelBtn">Cancel</button><button id="saveBtn">Create</button></div></div>`;
    document.body.appendChild(modal);
    document.getElementById('cancelBtn').onclick = () => modal.remove();
    document.getElementById('saveBtn').onclick = async () => {
      await apiFetch('/invoices', { method: 'POST', body: JSON.stringify({ clientName: invClient.value, description: invDesc.value, amount: parseFloat(invAmount.value), date: new Date().toISOString().slice(0,10) }) });
      modal.remove(); renderDashboard();
    };
  }

  async function renderDashboard() {
    const app = document.getElementById('app');
    const isAdmin = currentUser?.role === 'admin';
    const symbol = getCurrencySymbol(currentUser?.currency);
    
    let jobs = [], amcs = [], invoices = [], clients = [], techs = [], services = [];
    try {
      [jobs, amcs, invoices, clients, techs, services] = await Promise.all([
        apiFetch('/jobs'), apiFetch('/amcs'), apiFetch('/invoices'), apiFetch('/clients'), apiFetch('/technicians'), apiFetch('/services')
      ]);
    } catch(e) { console.error(e); }
    
    const openJobs = jobs.filter(j => j.status !== 'Completed').length;
    const totalRevenue = invoices.reduce((s,i) => s + i.amount, 0);
    const activeTechs = techs.filter(t => t.active).length;
    
    app.innerHTML = `
      <div class="app-layout">
        <div class="sidebar">
          <div class="sidebar-logo"><h2>Maint<span>Flow</span></h2><div class="tagline">HVAC • MEP • Civil</div></div>
          <div class="nav-item ${currentPage === 'dashboard' ? 'active' : ''}" data-page="dashboard"><span class="nav-icon">📊</span> <span>Dashboard</span></div>
          <div class="nav-item ${currentPage === 'amc' ? 'active' : ''}" data-page="amc"><span class="nav-icon">📑</span> <span>AMC Contracts</span></div>
          <div class="nav-item ${currentPage === 'tasks' ? 'active' : ''}" data-page="tasks"><span class="nav-icon">⚡</span> <span>Assigned Tasks</span></div>
          <div class="nav-item ${currentPage === 'invoices' ? 'active' : ''}" data-page="invoices"><span class="nav-icon">🧾</span> <span>Invoices</span></div>
          <div><div class="nav-item" data-page="customers"><span class="nav-icon">👥</span> <span>Customers</span></div>
          <div class="nav-item" data-page="technicians"><span class="nav-icon">🔧</span> <span>Technicians</span></div>
          <div class="nav-item" data-page="services"><span class="nav-icon">📋</span> <span>Services</span></div></div>
        </div>
        <div class="main-content">
          <div class="dashboard-header"><div><h1>Maintenance<span style="color:var(--accent)">Flow</span> PRO</h1></div>
          <div class="user-info"><span class="badge-role">👤 ${currentUser.company_name} (${currentUser.role})</span><button id="logoutBtn" class="btn-secondary">Logout</button></div></div>
          <div id="page-container"></div>
        </div>
      </div>`;
    
    const container = document.getElementById('page-container');
    
    if (currentPage === 'dashboard') {
      container.innerHTML = `
        <div class="stats-grid"><div class="stat-card"><div class="stat-label">Open Jobs</div><div class="stat-value">${openJobs}</div></div>
        <div class="stat-card"><div class="stat-label">AMC Contracts</div><div class="stat-value">${amcs.length}</div></div>
        <div class="stat-card"><div class="stat-label">Active Techs</div><div class="stat-value">${activeTechs}</div></div>
        <div class="stat-card"><div class="stat-label">Revenue (${symbol})</div><div class="stat-value">${symbol} ${totalRevenue.toLocaleString()}</div></div></div>
        <div class="card"><div class="card-header"><div class="card-title">📋 Recent Jobs</div><button id="newJobBtn" class="btn-secondary">+ New Job</button></div> <table><thead><tr><th>Customer</th><th>Service</th><th>Technician</th><th>Status</th></tr></thead><tbody id="recentJobsBody"></tbody> </table></div>
        <div class="card"><div class="card-title">👨‍🔧 Technicians</div><div id="dispatchList"></div></div>`;
      const tbody = document.getElementById('recentJobsBody');
      jobs.slice(0,5).forEach(job => {
        const row = tbody.insertRow();
        row.insertCell(0).innerHTML = job.customer_name;
        row.insertCell(1).innerHTML = job.service;
        row.insertCell(2).innerHTML = job.technician;
        row.insertCell(3).innerHTML = `<span class="badge ${job.status==='Completed'?'badge-completed':'badge-progress'}">${job.status}</span>`;
      });
      const dispatchDiv = document.getElementById('dispatchList');
      dispatchDiv.innerHTML = '';
      techs.forEach(tech => {
        const assigned = jobs.filter(j => j.technician === tech.name && j.status !== 'Completed').length;
        dispatchDiv.innerHTML += `<div class="dispatch-card"><div><strong>${tech.name}</strong><div style="font-size:0.7rem;">${tech.role}</div></div><div>${assigned} jobs</div></div>`;
      });
      document.getElementById('newJobBtn')?.addEventListener('click', () => showJobModal(clients, techs, services));
    } 
    else if (currentPage === 'amc') {
      container.innerHTML = `<div class="card"><div class="card-header"><div class="card-title">📑 AMC Contracts</div><button id="newAmcBtn" class="btn-secondary">+ Add Contract</button></div><div id="amcList"></div></div>`;
      const amcDiv = document.getElementById('amcList');
      amcDiv.innerHTML = amcs.map(a => `<div class="amc-item"><div><strong>${a.client_name}</strong><div>Exp: ${a.expiry}</div></div><div>${a.visits_per_year}/year <span class="badge">${a.status}</span></div></div>`).join('');
      document.getElementById('newAmcBtn')?.addEventListener('click', () => showAmcModal(clients));
    }
    else if (currentPage === 'tasks') {
      container.innerHTML = `<div class="card"><div class="card-title">⚡ Assigned Tasks</div><div class="kanban-grid" id="kanbanGrid"></div></div>`;
      const grid = document.getElementById('kanbanGrid');
      grid.innerHTML = techs.map(tech => `<div class="tech-card"><div><strong>${tech.name}</strong> (${tech.role})</div><div style="margin-top:12px;">${jobs.filter(j => j.technician === tech.name).map(j => `<div style="padding:8px;border-bottom:1px solid var(--border);"><div><strong>${j.customer_name}</strong></div><div>${j.service}</div><div><span class="badge ${j.status==='Completed'?'badge-completed':'badge-progress'}">${j.status}</span></div></div>`).join('') || '<div style="color:var(--text-muted);">No tasks</div>'}</div></div>`).join('');
    }
    else if (currentPage === 'invoices') {
      container.innerHTML = `<div class="card"><div class="card-header"><div class="card-title">🧾 Invoices</div><button id="newInvoiceBtn" class="btn-secondary">+ Create Invoice</button></div><table style="width:100%"><thead><tr><th>Client</th><th>Description</th><th>Amount (${symbol})</th><th>Date</th><th>PDF</th></tr></thead><tbody id="invoiceListBody"></tbody> </table></div>`;
      const invBody = document.getElementById('invoiceListBody');
      invoices.forEach(inv => {
        const row = invBody.insertRow();
        row.insertCell(0).innerHTML = inv.client_name;
        row.insertCell(1).innerHTML = inv.description;
        row.insertCell(2).innerHTML = `${symbol} ${inv.amount}`;
        row.insertCell(3).innerHTML = inv.date;
        row.insertCell(4).innerHTML = `<button class="btn-secondary" data-inv='${JSON.stringify(inv)}'>PDF</button>`;
        row.cells[4].querySelector('button').onclick = () => generatePDFInvoice(inv.client_name, inv.description, inv.amount);
      });
      document.getElementById('newInvoiceBtn')?.addEventListener('click', () => showInvoiceModal(clients));
    }
    else if (currentPage === 'customers') {
      container.innerHTML = `<div class="card"><div class="card-header"><div class="card-title">👥 Customers</div><button id="newCustomerBtn" class="btn-secondary">+ Add Customer</button></div><table style="width:100%"><thead><tr><th>Name</th><th>Contact</th><th>Address</th></tr></thead><tbody>${clients.map(c => `<tr><td>${c.name}</td><td>${c.contact || '-'}</td><td>${c.address || '-'}</td></tr>`).join('')}</tbody></table></div>`;
      document.getElementById('newCustomerBtn')?.addEventListener('click', async () => {
        const name = prompt('Customer name:'); if(!name) return;
        const contact = prompt('Contact:'); const address = prompt('Address:');
        await apiFetch('/clients', { method: 'POST', body: JSON.stringify({ name, contact, address }) });
        renderDashboard();
      });
    }
    else if (currentPage === 'technicians') {
      container.innerHTML = `<div class="card"><div class="card-header"><div class="card-title">🔧 Technicians</div><button id="newTechBtn" class="btn-secondary">+ Add Technician</button></div><table style="width:100%"><thead><tr><th>Name</th><th>Role</th><th>Active</th></tr></thead><tbody>${techs.map(t => `<tr><td>${t.name}</td><td>${t.role || '-'}</td><td>${t.active ? '✅' : '❌'}</td></tr>`).join('')}</tbody></table></div>`;
      document.getElementById('newTechBtn')?.addEventListener('click', async () => {
        const name = prompt('Technician name:'); if(!name) return;
        const role = prompt('Role:'); await apiFetch('/technicians', { method: 'POST', body: JSON.stringify({ name, role, active: true }) });
        renderDashboard();
      });
    }
    else if (currentPage === 'services') {
      container.innerHTML = `<div class="card"><div class="card-header"><div class="card-title">📋 Services</div><button id="newServiceBtn" class="btn-secondary">+ Add Service</button></div><table style="width:100%"><thead><tr><th>Service Name</th></tr></thead><tbody>${services.map(s => `<tr><td>${s.name}</td></tr>`).join('')}</tbody></table></div>`;
      document.getElementById('newServiceBtn')?.addEventListener('click', async () => {
        const name = prompt('Service name:'); if(!name) return;
        await apiFetch('/services', { method: 'POST', body: JSON.stringify({ name }) });
        renderDashboard();
      });
    }
    
    document.querySelectorAll('.nav-item[data-page]').forEach(el => {
      el.addEventListener('click', () => { currentPage = el.dataset.page; renderDashboard(); });
    });
    document.getElementById('logoutBtn')?.addEventListener('click', logout);
  }
  
  const savedToken = localStorage.getItem('token');
  const savedUser = localStorage.getItem('user');
  if (savedToken && savedUser) {
    authToken = savedToken;
    currentUser = JSON.parse(savedUser);
    renderDashboard().catch(() => renderLogin());
  } else {
    renderLogin();
  }
</script>
</body>
</html>
